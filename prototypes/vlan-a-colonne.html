<title>Fabric Lens — VLAN 100 — Colonne vertébrale</title>

<!--
  ===========================================================================
  MODELE DE NAVIGATION (3 lignes)
  1. La colonne de gauche est le PATH COMPLET du VLAN dans le fabric courant,
     calcule une fois par parcours en profondeur : chaine access (encap block ->
     pool -> domain -> AAEP -> IPG -> selectors -> ports -> leaves) puis chaine
     logique (EPG -> AP/tenant, BD/VRF/subnet, static paths, contracts -> entries).
  2. On est TOUJOURS sur exactement un objet ; la colonne marque sa position,
     la zone centrale montre sa config brute (DN + tous les attributs).
  3. On avance en cliquant un voisin ("vient de" / "mene a") ou une etape de la
     colonne ; fleches haut/bas = etape precedente/suivante du path,
     gauche/droite = parcourir les voisins, Entree = y entrer, Echap = retour.
  ===========================================================================
  DEGRADATION A 200 OBJETS
  - La colonne est deja scrollable et virtuellement lineaire : a 200 etapes elle
    fait ~5000px de haut. On garde le rendu complet (200 <li> restent peu couteux)
    mais on active alors le repli par section : chaque section de la colonne
    ("chaine access", "chaine logique", et au-dela : une section par EPG) devient
    un <details> ouvert seulement autour de la position courante, les autres
    replies sur une ligne de resume "EPG DAFE_EPG - 24 objets". Le fil accent
    continue de traverser les sections repliees, donc la lecture "ou j'en suis"
    ne change pas. Second garde-fou : au-dela de 60 etapes, les feuilles
    repetitives (portBlk, nodeBlk, filter entries) sont regroupees sous leur
    parent en une ligne "12 port blocks" depliable a la demande, ce qui ramene
    200 objets a ~50 lignes visibles. La zone centrale, elle, ne change pas :
    elle n'affiche jamais qu'un objet et ses voisins directs.
  ===========================================================================
-->

/* Nocturne — design-system tokens and component classes.
   Source: Claude Design project "Cisco ACI Policy Analyzer"

/* Pas d'@import distant : les prototypes doivent se charger hors ligne (un @import

:root {

  --color-neutral-200: #e4e7f5;
  --color-neutral-300: #cfd3e5;
  --color-neutral-400: #b2b6ca;
  --color-neutral-500: #9397ab;
  --color-neutral-600: #75798c;
  --color-neutral-700: #595d6c;
  --color-neutral-800: #3f424d;
  --color-neutral-900: #292b31;

  --color-accent-100: #f5f4ff;
  --color-accent-200: #e7e5fe;
  --color-accent-300: #d2cefd;
  --color-accent-400: #b5abfc;
  --color-accent-500: #968ae0;
  --color-accent-600: #796cbf;
  --color-accent-700: #5d5294;
  --color-accent-800: #423a6a;
  --color-accent-900: #2b2741;

  --color-accent-2-100: #f5f4ff;
  --color-accent-2-200: #e7e5fe;
  --color-accent-2-300: #d2cefd;
  --color-accent-2-400: #b5afe8;
  --color-accent-2-500: #9690c9;
  --color-accent-2-600: #7972a9;
  --color-accent-2-700: #5c5783;
  --color-accent-2-800: #423e5d;
  --color-accent-2-900: #2b293a;

  --color-section: #262a60;
  --color-section-glow: #353b80;
  --color-section-ghost: #4c5397;

  --font-heading: "Inter", system-ui, sans-serif;
  --font-heading-weight: 500;
  --font-body: "Inter", system-ui, sans-serif;

  --space-1: 2.8px;
  --space-2: 5.6px;
  --space-3: 8.4px;
  --space-4: 11.2px;
  --space-6: 16.8px;
  --space-8: 22.4px;

  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 14px;

  --shadow-sm: 0 0 0 1px #3f424d;

}

body {
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-body);
}

.lighten { mix-blend-mode: lighten; background-color: transparent; }

/* ── Base ─────────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }
h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);
}
h1 { font-size: 42px; }
h2 { font-size: 32px; }
h3 { font-size: 25px; }
h4 { font-size: 20px; }
h5 { font-size: 16px; }
h6 { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; }
p { margin: 0 0 var(--space-3); }
a { color: var(--color-accent); text-underline-offset: 3px; }
img { display: block; max-width: 100%; }
figure { margin: 0; }
figcaption {

}
.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }
.mono { font-family: ui-monospace, SFMono-Regular, "Cascadia Mono", Consolas, Menlo, monospace; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }

/* ── Rules ────────────────────────────────────────────────────────────── */
.hr {
  height: 1px; border: 0; margin: var(--space-4) 0;
  background: linear-gradient(to right,
    transparent, var(--color-divider) 48px,

}

/* ── Buttons ──────────────────────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  cursor: pointer; text-decoration: none;
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 14px; line-height: 1.2; color: var(--color-text);
  background: transparent; border: 1px solid transparent;
  padding: var(--space-2) calc(var(--space-3) * 1.2);
  border-radius: var(--radius-md);
}
.btn svg { display: block; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { color: var(--color-accent); border-color: var(--color-accent); }
.btn-primary:hover { background: color-mix(in srgb, var(--color-accent) 12%, transparent); }
.btn-primary:active { background: color-mix(in srgb, var(--color-accent) 22%, transparent); }
.btn-secondary { border-color: var(--color-divider); }
.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }
.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }
.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }
.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }
.btn-icon { width: 36px; height: 36px; padding: 0; }
.btn-block { width: 100%; margin-top: var(--space-2); }

/* ── Forms ────────────────────────────────────────────────────────────── */
.field > label {
  display: block; font-size: 12px; margin-bottom: 5px;
  color: color-mix(in srgb, var(--color-text) 70%, transparent);
}
.input {
  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;
  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);
  background: var(--color-surface);
  border: 1px solid var(--color-divider); border-radius: var(--radius-md);
}
.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }
.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }
textarea.input { min-height: 90px; resize: vertical; }
.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }
.radio input, .seg-opt input {
  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;
}
.radio .dot {
  width: 16px; height: 16px; flex: none; border-radius: 50%;
  border: 1.5px solid var(--color-divider);
}
.radio:hover .dot { border-color: var(--color-accent); }
.radio input:checked + .dot {
  border-color: var(--color-accent); background: var(--color-accent);
  box-shadow: inset 0 0 0 4px var(--color-bg);
}
.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }
.seg {
  display: inline-flex; overflow: hidden;
  border: 1px solid var(--color-divider); border-radius: var(--radius-md);
}
.seg-opt {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 12px; font-size: 13px; cursor: pointer;
}
.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }
.seg-opt:has(input:checked) { color: var(--color-accent); box-shadow: inset 0 0 0 1px var(--color-accent); }
.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }

/* ── Cards ────────────────────────────────────────────────────────────── */
.card {
  display: flex; flex-direction: column; gap: var(--space-2);
  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);
}
.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }
.card-title {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 17px; line-height: 1.2;
}
.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }
.card-meta {
  display: flex; align-items: center; gap: 6px; font-size: 11px;
  color: color-mix(in srgb, var(--color-text) 50%, transparent);
}
.elev-sm { box-shadow: var(--shadow-sm); }
.elev-md { box-shadow: var(--shadow-md); }
.elev-lg { box-shadow: var(--shadow-lg); }

/* ── Tags ─────────────────────────────────────────────────────────────── */
.tag {
  display: inline-flex; align-items: center; font-size: 11px;
  letter-spacing: 0.02em; padding: 3px 10px;
  border-radius: calc(var(--radius-md) * 0.75);
}
.tag-accent { background: var(--color-accent-800); color: var(--color-accent-100); }
.tag-accent-2 { background: var(--color-accent-2-800); color: var(--color-accent-2-100); }
.tag-neutral { background: var(--color-neutral-800); color: var(--color-neutral-100); }
.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }

/* ── Navigation ───────────────────────────────────────────────────────── */
.nav {
  display: flex; align-items: center; gap: var(--space-4);
  padding: var(--space-3) var(--space-4);
  border-bottom: none;
}
.nav-brand {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 18px; margin-right: auto;
}
.nav a { color: inherit; text-decoration: none; font-size: 14px; }
.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }

/* ── Tables ───────────────────────────────────────────────────────────── */
.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table th {
  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
  color: color-mix(in srgb, var(--color-text) 60%, transparent);
  padding: var(--space-2); border-bottom: 1px solid transparent;
}
.table td { padding: var(--space-2); border-bottom: 1px solid transparent; }
.table thead tr {
  background: linear-gradient(to right,
    transparent, var(--color-divider) 48px,
    var(--color-divider) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px;
}
.table tbody tr {
  background: linear-gradient(to right,
    transparent, color-mix(in srgb, var(--color-text) 8%, transparent) 48px,
    color-mix(in srgb, var(--color-text) 8%, transparent) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px;
}
.table tbody tr:hover {
  background:
    linear-gradient(color-mix(in srgb, var(--color-text) 4%, transparent),
                    color-mix(in srgb, var(--color-text) 4%, transparent)) no-repeat 0 0 / 100% 100%,
    linear-gradient(to right,
      transparent, color-mix(in srgb, var(--color-text) 8%, transparent) 48px,
      color-mix(in srgb, var(--color-text) 8%, transparent) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px;
}

/* ── Dialog ───────────────────────────────────────────────────────────── */
.dialog-backdrop {
  position: fixed; inset: 0; display: grid; place-items: center;
  padding: var(--space-4);
  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);
}
.dialog {
  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);
  padding: var(--space-4); border-radius: var(--radius-lg);
  background: var(--color-surface); box-shadow: var(--shadow-lg);
}
.dialog-title {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 20px;
}
.dialog-body { font-size: 14px; opacity: 0.85; }
.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }

/* ─────────────────────────────────────────────────────────────────────────
   Ecran : recherche VLAN — modele « colonne vertebrale »
   ───────────────────────────────────────────────────────────────────────── */

html, body { height: 100%; }
body { overflow: hidden; }

.app {
  height: 100vh;
  display: grid;
  grid-template-rows: auto 1fr;
}

/* ── Barre superieure ───────────────────────────────────────────────────── */
.topbar {
  display: flex; align-items: center; gap: var(--space-4); flex-wrap: wrap;
  padding: var(--space-3) var(--space-6);
  background: var(--color-bg);
  box-shadow: 0 1px 0 0 var(--color-divider);
  position: relative; z-index: 3;
}
.brand-pill {
  display: grid; place-items: center;
  width: 28px; height: 28px; flex: none;
  border-radius: var(--radius-sm);
  background: var(--color-accent-900);
  color: var(--color-accent-300);
  font-family: var(--font-heading); font-weight: 600; font-size: 12px;
  box-shadow: inset 0 0 0 1px var(--color-accent-800);
}
.brand-txt { font-family: var(--font-heading); font-weight: 500; font-size: 14px; }
.brand-txt span { color: var(--color-neutral-500); }

.query-chip {
  display: inline-flex; align-items: center; gap: var(--space-2);
  padding: var(--space-1) var(--space-3);
  border-radius: var(--radius-md);
  border: 1px solid var(--color-accent-700);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--color-accent) 9%, transparent);
  font-size: 12px;
}
.query-chip b { font-weight: 600; color: var(--color-accent-300); }

.topbar-right { margin-left: auto; display: flex; align-items: center; gap: var(--space-4); }
.freshness { font-size: 11px; color: var(--color-neutral-500); text-align: right; line-height: 1.35; }

/* ── Selecteur de fabric ────────────────────────────────────────────────── */
.fabsel { display: flex; align-items: center; gap: var(--space-1); flex-wrap: wrap; }
.fabsel-lbl { font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--color-neutral-600); margin-right: var(--space-2); }
.fab {
  cursor: pointer; font: inherit; font-size: 11.5px; flex: none;
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 10px; border-radius: var(--radius-md);
  background: transparent; color: var(--color-neutral-300);
  border: 1px solid transparent;
}
.fab:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
.fab .dotlet { width: 5px; height: 5px; border-radius: 50%; background: var(--color-neutral-600); flex: none; }
.fab[aria-pressed="true"] {
  color: var(--color-accent-300);
  box-shadow: inset 0 0 0 1px var(--color-accent),
              0 0 12px color-mix(in srgb, var(--color-accent) 22%, transparent);
}
.fab[aria-pressed="true"] .dotlet {
  background: var(--color-accent);
  box-shadow: 0 0 6px var(--color-accent);
}

/* ── Grille principale ──────────────────────────────────────────────────── */
.main {
  display: grid;
  grid-template-columns: 348px 1fr;
  min-height: 0;
}
/* la colonne du path ne disparait jamais : elle retrecit, elle ne se replie pas */
@media (max-width: 1280px) { .main { grid-template-columns: 300px 1fr; } }
@media (max-width: 1080px) { .main { grid-template-columns: 252px 1fr; } }

/* ── Colonne vertebrale ─────────────────────────────────────────────────── */
.spine {
  min-height: 0; display: grid; grid-template-rows: auto 1fr auto;
  background: color-mix(in srgb, var(--color-surface) 55%, var(--color-bg));
  box-shadow: 1px 0 0 0 var(--color-divider);
}
.spine-head { padding: var(--space-4) var(--space-6) var(--space-3); }
.spine-head h6 { margin: 0 0 2px; color: var(--color-neutral-400); }
.spine-head .sub { font-size: 11px; color: var(--color-neutral-600); }

.spine-scroll { overflow-y: auto; overflow-x: hidden; padding: 0 var(--space-4) var(--space-6) var(--space-6); }
.spine-scroll::-webkit-scrollbar { width: 9px; }
.spine-scroll::-webkit-scrollbar-thumb {
  background: var(--color-neutral-800); border-radius: 99px;
  border: 3px solid var(--color-bg);
}

.spine-list { position: relative; list-style: none; margin: 0; padding: 0; }
/* le rail : gris sur toute la hauteur, accent jusqu'a la position courante */
.spine-list::before {
  content: ""; position: absolute; left: 6px; top: 8px; bottom: 8px; width: 1px;
  background: var(--color-neutral-800);
}
.spine-prog {
  position: absolute; left: 5px; top: 8px; width: 3px; border-radius: 99px;
  background: linear-gradient(to bottom,
      color-mix(in srgb, var(--color-accent) 35%, transparent),
      var(--color-accent));
  box-shadow: 0 0 10px color-mix(in srgb, var(--color-accent) 55%, transparent);
  transition: height .32s cubic-bezier(.4,.9,.3,1);
  height: 0;
}

.sec-head {
  margin: var(--space-6) 0 var(--space-2); padding-left: var(--space-6);
  font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--color-neutral-600);
}
.sec-head:first-child { margin-top: var(--space-2); }

.step {
  position: relative; display: block; width: 100%; text-align: left;
  cursor: pointer; font: inherit;
  background: transparent; border: 0; color: inherit;
  padding: 3px var(--space-3) 3px var(--space-6);
  border-radius: var(--radius-sm);
  line-height: 1.25;
}
.step .knob {
  position: absolute; left: 3px; top: 9px;
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--color-bg);
  box-shadow: inset 0 0 0 1.5px var(--color-neutral-700);
}
.step.done .knob { background: var(--color-accent-600); box-shadow: inset 0 0 0 1.5px var(--color-accent-600); }
.step.cur .knob {
  background: var(--color-accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--color-accent) 22%, transparent),
              0 0 10px var(--color-accent);
}
.step .k {
  display: block; font-size: 9px; letter-spacing: .08em; text-transform: uppercase;
  color: var(--color-neutral-600);
}
.step .n {
  display: block; font-size: 12px; font-weight: 500;
  color: var(--color-neutral-300);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.step:hover { background: color-mix(in srgb, var(--color-text) 6%, transparent); }
.step:hover .n { color: var(--color-neutral-100); }
.step.done .k { color: var(--color-neutral-500); }
.step.cur {
  background: color-mix(in srgb, var(--color-accent) 11%, transparent);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--color-accent) 45%, transparent);
}
.step.cur .n { color: var(--color-accent-200); }
.step.cur .k { color: var(--color-accent-400); }
.step.match .n::after {
  content: "●"; font-size: 7px; vertical-align: middle;
  margin-left: 6px; color: var(--color-accent);
}
/* objets hors requete : en retrait, grises, plus petits — jamais masques */
.step.off { opacity: .5; }
.step.off .n { font-size: 10.5px; color: var(--color-neutral-500); font-weight: 400; }
.step.off .k { font-size: 8.5px; }

.spine-foot {
  padding: var(--space-3) var(--space-6);
  font-size: 10.5px; color: var(--color-neutral-600);
  box-shadow: 0 -1px 0 0 var(--color-divider);
  display: flex; gap: var(--space-4); flex-wrap: wrap;
}
.spine-foot kbd {
  font-family: ui-monospace, Consolas, monospace; font-size: 10px;
  padding: 1px 5px; border-radius: var(--radius-sm);
  background: var(--color-neutral-900); color: var(--color-neutral-400);
  box-shadow: inset 0 0 0 1px var(--color-neutral-800);
}

/* ── Zone objet ─────────────────────────────────────────────────────────── */
.stage { min-height: 0; overflow-y: auto; overflow-x: hidden; position: relative; }
.stage::-webkit-scrollbar { width: 10px; }
.stage::-webkit-scrollbar-thumb {

// ordre de lecture des relations sortantes : contenance d'abord, contrats en dernier
const REL_RANK = {
  'contenu-dans': 0, 'utilise-par': 1, 'deploie': 1, 'vers-epg': 1, 'vers-bd': 1, 'vers-vrf': 1,
  'selectionne-par': 2, 'contient': 2, 'vers-filter': 2,
  'vers-l3out': 3, 'vers-domaine': 4, 'static-port': 5, 'provide': 6, 'consume': 7
};
const REL_LABEL = {
  'contenu-dans': 'contenu dans', 'contient': 'contient', 'utilise-par': 'utilisé par',
  'selectionne-par': 'sélectionné par', 'deploie': 'déploie', 'vers-epg': 'vers EPG',
  'vers-bd': 'vers Bridge Domain', 'vers-vrf': 'vers VRF', 'vers-l3out': 'vers L3Out',
  'vers-domaine': 'vers domain', 'vers-filter': 'vers filter', 'static-port': 'static path',
  'provide': 'provide', 'consume': 'consume'
};
const SECTIONS = {
  access: 'Chaîne access policies',
  logique: 'Chaîne logique',
  autres: 'Autres objets rattachés'
};

const MODELS = {};
DATA.fabrics.forEach(f => { MODELS[f.id] = buildModel(f); });

function buildModel(fab) {
  const out = new Map(), inc = new Map();
  fab.edges.forEach(e => {
    if (!fab.nodes[e.from] || !fab.nodes[e.to]) return;
    (out.get(e.from) || out.set(e.from, []).get(e.from)).push(e);
    (inc.get(e.to) || inc.set(e.to, []).get(e.to)).push(e);
  });
  // les objets d'une autre encapsulation passent en dernier dans leur groupe (jamais masqués)
  const offq = e => (fab.nodes[e.to] && fab.nodes[e.to].matchesQuery === false) ? 1 : 0;
  const kids = dn => (out.get(dn) || []).slice().sort((a, b) =>
    (REL_RANK[a.rel] ?? 9) - (REL_RANK[b.rel] ?? 9) || offq(a) - offq(b));

  const spine = [], seen = new Set();
  function dfs(dn, depth, section, stopEpg) {
    if (seen.has(dn) || !fab.nodes[dn]) return;
    seen.add(dn);
    spine.push({ dn, depth, section });
    kids(dn).forEach(e => {
      if (stopEpg && fab.nodes[e.to] && fab.nodes[e.to].kind === 'epg') return; // l'EPG ouvre la chaîne logique
      dfs(e.to, depth + 1, section, stopEpg);
    });
  }
  fab.roots.forEach(r => dfs(r, 0, 'access', true));
  Object.keys(fab.nodes).forEach(dn => { if (fab.nodes[dn].kind === 'epg') dfs(dn, 0, 'logique', false); });
  Object.keys(fab.nodes).forEach(dn => dfs(dn, 0, 'autres', false));

  const idx = new Map(); spine.forEach((s, i) => idx.set(s.dn, i));
  // rang de l'objet parmi ceux de sa classe fonctionnelle — sert au passage d'un fabric à l'autre
  const ord = new Map(), count = {};
  spine.forEach(s => {
    const k = fab.nodes[s.dn].kind;
    count[k] = (count[k] || 0); ord.set(s.dn, count[k]); count[k]++;
  });
  return { fab, out, inc, spine, idx, ord };
}

    b.innerHTML = '<span class="dotlet"></span><span class="mono">' + esc(f.id) + '</span>';
    b.title = f.id + ' — ' + (STATUS_TXT[f.status] || f.status) + ' · ' + f.summary;
    b.onclick = () => switchFabric(f.id);
    nav.appendChild(b);
  });
  const f = model().fab, bk = f.backup || {};
  document.getElementById('freshness').innerHTML =
    'Backup <span class="mono">' + esc(bk.file || '—') + '</span><br>' +
    'résolu le <span class="mono">' + esc((bk.generatedAt || '').replace('T', ' ').replace('Z', ' UTC')) + '</span>';
  document.getElementById('q-txt').textContent = 'VLAN ' + DATA.query.value;
}

/* ── Colonne vertebrale ─────────────────────────────────────────────────── */
function renderSpine() {
  const m = model(), list = document.getElementById('spine-list');
  list.querySelectorAll('.step, .sec-head, li').forEach(n => n.remove());
  let sec = null, i = 0;
  const curIdx = m.idx.get(cur);
  m.spine.forEach((s, si) => {
    const n = m.fab.nodes[s.dn];
    if (!n) return;                       // garde-fou : jamais d'etape sans objet resolu
    if (s.section !== sec) {
      sec = s.section;
      const h = document.createElement('div');
      h.className = 'sec-head'; h.textContent = SECTIONS[sec] || sec;
      h.style.animationDelay = (i * 18) + 'ms';
      list.appendChild(h); i++;
    }
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'step' + (si < curIdx ? ' done' : '') + (si === curIdx ? ' cur' : '')
      + (n.matchesQuery === true ? ' match' : '') + (n.matchesQuery === false ? ' off' : '');
    b.style.paddingLeft = (16.8 + s.depth * 9) + 'px';
    b.style.animationDelay = (i * 18) + 'ms';
    b.dataset.dn = s.dn;
    b.setAttribute('aria-current', si === curIdx ? 'true' : 'false');
    b.innerHTML = '<span class="knob"></span>'
      + '<span class="k">' + esc(n.clsLabel) + '</span>'
      + '<span class="n mono">' + esc(n.label) + '</span>';
    b.title = n.label + ' — ' + n.cls + (n.note ? ' · ' + n.note : '');
    b.onclick = () => go(s.dn, si > curIdx ? 'fwd' : 'back');
    li.appendChild(b); list.appendChild(li); i++;
  });
  document.getElementById('spine-sub').innerHTML =
    '<span class="mono">' + m.spine.length + '</span> objets · '
    + '<span class="mono">' + esc(m.fab.id) + '</span> · ' + esc(m.fab.summary);
  requestAnimationFrame(paintProgress);
}

function paintProgress() {
  const el = document.querySelector('.step.cur'), prog = document.getElementById('spine-prog');
  const list = document.getElementById('spine-list'), sc = document.getElementById('spine-scroll');
  if (!prog || !list || !sc) return;
  if (!el) { prog.style.height = '0px'; return; }
  const r = el.getBoundingClientRect(), rl = list.getBoundingClientRect(), rs = sc.getBoundingClientRect();
  // le fil accent s'arrête au centre de l'étape courante
  const hpx = (r.top - rl.top) + r.height / 2 - 8;
  prog.style.height = (Number.isFinite(hpx) ? Math.max(0, hpx) : 0) + 'px';
  if (r.top < rs.top + 24 || r.bottom > rs.bottom - 24)
    sc.scrollTo({
      top: sc.scrollTop + (r.top - rs.top) - sc.clientHeight / 2,
      behavior: document.body.classList.contains('boot') ? 'auto' : 'smooth'
    });
}

/* ── Zone objet ─────────────────────────────────────────────────────────── */
function renderObj(dir, equivNote) {
  const m = model(), n = m.fab.nodes[cur];
  const stage = document.getElementById('stage');
  if (!stage || !n) return;               // garde-fou : rien a afficher sans objet resolu
  const o = document.createElement('article');
  o.className = 'obj ' + (dir || 'fwd');

  // fil de retour (historique) — la colonne reste le repere principal
  let h = '<div class="crumb">';
  h += '<button type="button" id="backbtn"' + (hist.length ? '' : ' disabled style="opacity:.35;cursor:default"') + '>← Retour</button>';
  const stepNo = m.idx.has(cur) ? m.idx.get(cur) + 1 : '—';   // jamais « NaN / 21 »
  h += '<span class="sep">·</span><span>étape <span class="mono">' + stepNo + '</span> / <span class="mono">' + m.spine.length + '</span> du path</span>';
  h += '</div>';

  if (equivNote) h += '<div class="equiv">Objet équivalent dans <b class="mono">' + esc(m.fab.id) + '</b> : ' + esc(equivNote) + '</div>';

  h += '<div class="obj-head"><div style="min-width:0">'
     + '<div class="obj-kicker">' + esc(n.clsLabel) + '</div>'
     + '<div class="obj-title mono">' + esc(n.label) + '</div>'
     + '<div class="obj-cls">classe <span class="mono">' + esc(n.cls) + '</span> · '
     + Object.keys(n.attrs).length + ' attributs</div>'
     + '<div class="obj-badges">' + badges(n) + '</div>'
     + '</div></div>';

  h += '<div class="dnbar"><span class="lbl">DN</span>'
     + '<span class="val mono" id="dnval">' + esc(n.dn) + '</span>'
     + '<button type="button" class="btn btn-secondary" id="copydn">Copier</button></div>';

  h += '<div class="cols"><section>';
  h += deployBox(n);
  h += '<div class="panel-lbl">Configuration brute <i>' + Object.keys(n.attrs).length + ' attributs</i></div>';
  h += attrTable(n);
  h += '</section><section>' + neighbours(n) + '</section></div>';
  // la legende passe sous les deux colonnes : en pile (<1180px) elle ne s'intercale
  // plus entre la config et la liste des voisins
  h += legend();

  o.innerHTML = h;
  stage.replaceChildren(o);
  stage.scrollTop = 0;

  const cp = o.querySelector('#copydn'); if (cp) cp.onclick = e => copy(n.dn, e.currentTarget);
  const bb = o.querySelector('#backbtn'); if (bb && hist.length) bb.onclick = back;
  o.querySelectorAll('[data-goto]').forEach(b => {
    b.onclick = () => go(b.dataset.goto, 'fwd');
  });
  nbFocus = -1;
}

function badges(n) {
  const m = model(), b = [];
  if (n.matchesQuery === true)
    b.push('<span class="tag tag-outline">porte VLAN ' + DATA.query.value + '</span>');
  if (n.matchesQuery === false)
    b.push('<span class="tag tag-off">autre encapsulation</span>');
  if (n.kind === 'staticPath') b.push('<span class="tag tag-accent">déploiement : static port</span>');
  if (n.kind === 'aaepDeploy') b.push('<span class="tag tag-accent-2">déploiement : via AAEP</span>');
  if (n.kind === 'encapBlk') b.push('<span class="tag tag-neutral">racine du path</span>');
  if (n.note && n.kind !== 'epg') b.push('<span class="tag tag-neutral">' + esc(n.note) + '</span>');
  b.push('<span class="tag tag-neutral tag-mono">' + esc(m.fab.id) + '</span>');
  return b.join('');
}

function deployBox(n) {
  const m = model();
  if (n.kind === 'epg') {
    // Le mode vient de la donnee structuree produite par le resolveur, JAMAIS
    // d'une regex sur le libelle : un EPG peut etre deploye des DEUX facons a
    // la fois, et c'est le cas sur 3 des 5 fabrics reels.
    const dep = n.deployment || {};
    const ns = (dep.staticPaths || []).length, na = (dep.aaepDeploys || []).length;
    const mode = dep.mode || (ns && na ? 'both' : ns ? 'static-port' : na ? 'aaep' : 'inconnu');
    const TITRE = { 'both': 'LES DEUX — static port ET via AAEP',
                    'static-port': 'static port',
                    'aaep': 'via AAEP',
                    'inconnu': 'indetermine' }[mode];
    const DETAIL = {
      'both': 'L\'EPG recoit ce VLAN par <b>' + ns + ' static path binding</b> '
            + '(<span class="mono">fvRsPathAtt</span>) <b>et</b> par <b>' + na
            + ' deploiement AAEP</b> (<span class="mono">infraRsFuncToEpg</span>). '
            + 'Les deux chemins coexistent : c\'est souvent involontaire, et les ports '
            + 'herites de l\'AAEP ne sont pas forcement ceux du static path. A verifier.',
      'static-port': 'Le VLAN est cable par ' + ns + ' <span class="mono">fvRsPathAtt</span> '
            + 'sous l\'EPG. Aucun deploiement via AAEP. Les static paths d\'une autre '
            + 'encapsulation restent affiches, en retrait.',
      'aaep': 'Le VLAN arrive par ' + na + ' <span class="mono">infraRsFuncToEpg</span> de '
            + 'l\'AAEP, qui porte lui-meme l\'encapsulation. Aucun '
            + '<span class="mono">fvRsPathAtt</span> ne le porte sous l\'EPG.',
      'inconnu': 'Aucun objet porteur de cette encapsulation n\'a ete trouve sous cet EPG.'
    }[mode];
    return '<div class="note-box' + (mode === 'both' ? ' note-box-alert' : '') + '">'
      + '<b>Deploiement du VLAN sur cet EPG : ' + TITRE + '.</b>'
      + '<span class="sub">' + DETAIL + '</span></div>';
  }
  if (n.kind === 'aaepDeploy')
    return '<div class="note-box"><b>Deuxième voie de déploiement : l\'AAEP.</b>'
      + '<span class="sub">Cet objet <span class="mono">infraRsFuncToEpg</span> porte lui-même l\'encapsulation '
      + '(<span class="mono">encap</span>) et rattache l\'EPG à tous les ports qui héritent de l\'AAEP, '
      + 'sans static path sous l\'EPG.</span></div>';
  if (n.kind === 'staticPath' && n.matchesQuery === false)
    return '<div class="note-box" style="box-shadow:inset 0 0 0 1px var(--color-neutral-800);background:color-mix(in srgb,var(--color-text) 4%,transparent);color:var(--color-neutral-400)">'
      + '<b style="color:var(--color-neutral-300)">Static path d\'une autre encapsulation.</b>'
      + '<span class="sub">Il ne porte pas le VLAN ' + DATA.query.value + ', mais il est conservé : il montre que le même EPG transporte plusieurs VLAN.</span></div>';
  if (n.kind === 'staticPath')
    return '<div class="note-box"><b>Déploiement : static port.</b>'
      + '<span class="sub"><span class="mono">fvRsPathAtt</span> sous l\'EPG — le VLAN est posé sur un port précis.</span></div>';
  return '';
}

const HL_ATTR = { encap: 1, from: 1, to: 1, allocMode: 1, ip: 1, mode: 1, tDn: 1 };
function attrTable(n) {
  const m = model();
  const keys = Object.keys(n.attrs).sort();
  if (!keys.length) return '<div class="text-muted" style="font-size:12px">Aucun attribut dans le backup.</div>';
  let h = '<table class="table attrs"><thead><tr><th>Attribut</th><th>Valeur</th></tr></thead><tbody>';
  keys.forEach(k => {
    const v = n.attrs[k];
    const hi = HL_ATTR[k] || (typeof v === 'string' && v.indexOf('vlan-' + DATA.query.value) === 0);
    let vh;
    if (v === '' || v === null || v === undefined) vh = '<span class="empty">—</span>';
    else if (m.fab.nodes[v]) vh = '<button type="button" class="jump mono" data-goto="' + esc(v) + '">' + esc(v) + ' →</button>';
    else vh = esc(String(v));
    h += '<tr' + (hi ? ' class="hi"' : '') + '><td class="k mono">' + esc(k) + '</td><td class="v mono">' + vh + '</td></tr>';
  });
  return h + '</tbody></table>';
}

function neighbours(n) {
  const m = model();
  // une arete dont la cible n'est pas dans nodes est ignoree (jamais de lecture sur undefined)
  const inc = (m.inc.get(n.dn) || []).map(e => ({ e, dn: e.from })).filter(x => m.fab.nodes[x.dn]);
  const out = (m.out.get(n.dn) || []).map(e => ({ e, dn: e.to })).filter(x => m.fab.nodes[x.dn]);
  const sortf = (a, b) => {
    const na = m.fab.nodes[a.dn], nb = m.fab.nodes[b.dn];
    if ((na.matchesQuery === false) !== (nb.matchesQuery === false)) return na.matchesQuery === false ? 1 : -1;
    return (REL_RANK[a.e.rel] ?? 9) - (REL_RANK[b.e.rel] ?? 9);
  };
  inc.sort(sortf); out.sort(sortf);
  let h = '';
  h += group('Vient de', inc, '←');
  h += group('Mène à', out, '→');
  if (!inc.length && !out.length)
    h += '<div class="text-muted" style="font-size:12px">Objet terminal : aucun voisin résolu.</div>';
  return h;

  function group(title, arr, arrow) {
    if (!arr.length) return '';
    let s = '<div class="rel-group"><div class="panel-lbl">' + title + ' <i>' + arr.length + '</i></div>';
    arr.forEach(x => {
      const t = m.fab.nodes[x.dn];
      if (!t) return;
      s += '<button type="button" class="nb' + (t.matchesQuery === false ? ' off' : '') + '" data-goto="' + esc(x.dn) + '">'
        + '<span class="arrow">' + arrow + '</span>'
        + '<span class="rel">' + esc(x.e.label || REL_LABEL[x.e.rel] || x.e.rel) + '</span>'
        + '<span class="nm mono">' + esc(t.label) + '</span>'
        + '<span class="cl">' + esc(t.clsLabel) + (t.note ? ' · ' + esc(t.note) : '') + '</span>'
        + '</button>';
    });
    return s + '</div>';
  }
}

function legend() {
  return '<div class="legend">'
    + '<b>Lecture du path.</b> La colonne de gauche liste le chemin entier résolu depuis le backup : '
    + 'la chaîne <b>access policies</b> descend de l\'encap block jusqu\'aux ports physiques, '
    + 'la chaîne <b>logique</b> part de l\'EPG jusqu\'aux filter entries. '
    + 'Un point plein = étape déjà parcourue, un point creux = étape à venir, '
    + 'un point auréolé = position courante. Les objets <b>grisés et plus petits</b> portent '
    + 'une autre encapsulation que le VLAN ' + DATA.query.value + ' : ils restent visibles car ils révèlent '
    + 'que le même EPG transporte plusieurs VLAN.'
    + '</div>';
}

/* ── Navigation ─────────────────────────────────────────────────────────── */
function model() { return MODELS[fabId]; }

function go(dn, dir, opts) {
  const m = model();
  if (!m || !dn || !m.fab.nodes[dn] || dn === cur) return;   // cible absente de nodes : on ignore
  if (cur && !(opts && opts.nohist)) hist.push({ fabId, dn: cur });
  cur = dn;
  renderSpine();
  renderObj(dir, opts && opts.equiv);
}

function back() {
  const h = hist.pop(); if (!h || !MODELS[h.fabId]) return;
  if (!MODELS[h.fabId].fab.nodes[h.dn]) return;
  const dir = 'back';
  if (h.fabId !== fabId) { fabId = h.fabId; renderFabSel(); }
  cur = h.dn; renderSpine(); renderObj(dir);
}

// passage d'un fabric a l'autre : on retrouve l'objet equivalent quand il existe
function switchFabric(id) {
  if (id === fabId || !MODELS[id]) return;
  const from = model(), to = MODELS[id];
  if (!to.spine.length) return;
  const n = from.fab.nodes[cur] || {};
  let target = null, note = null;
  if (to.fab.nodes[cur]) target = cur;                                   // même DN
  if (!target) {                                                          // même classe + même nom
    target = to.spine.map(s => s.dn).find(d => to.fab.nodes[d].kind === n.kind && to.fab.nodes[d].label === n.label) || null;
  }
  if (!target) {                                                          // même classe, même rang
    const rank = from.ord.has(cur) ? from.ord.get(cur) : 0;   // sinon Math.min -> NaN -> same[NaN]
    const same = to.spine.map(s => s.dn).filter(d => to.fab.nodes[d].kind === n.kind);
    if (same.length) { target = same[Math.min(rank, same.length - 1)]; note = to.fab.nodes[target].clsLabel + ' correspondant'; }
  }
  if (!target) {                                                          // sinon : ancêtre le plus proche dans le path
    for (let i = (from.idx.has(cur) ? from.idx.get(cur) : 0) - 1; i >= 0 && !target; i--) {
      const k = from.fab.nodes[from.spine[i].dn].kind;
      const c = to.spine.map(s => s.dn).find(d => to.fab.nodes[d].kind === k);
      if (c) { target = c; note = 'pas de ' + n.clsLabel + ' ici — remonté au ' + to.fab.nodes[c].clsLabel; }
    }
  }
  if (!target) { target = to.spine[0].dn; note = 'pas d\'équivalent — retour à la racine du path'; }
  hist.push({ fabId, dn: cur });
  fabId = id; cur = target;
  renderFabSel(); renderSpine(); renderObj('fwd', note);
}

/* ── Clavier ────────────────────────────────────────────────────────────── */
document.addEventListener('keydown', ev => {
  // ne jamais confisquer les raccourcis navigateur ni la saisie dans un champ
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const ae = document.activeElement;
  if (ae && (ae.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName))) return;
  const m = model();
  if (!m || !m.spine.length) return;
  const i = m.idx.has(cur) ? m.idx.get(cur) : -1;
  if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
    ev.preventDefault();
    const j = i + (ev.key === 'ArrowDown' ? 1 : -1);
    if (j >= 0 && j < m.spine.length) {
      go(m.spine[j].dn, ev.key === 'ArrowDown' ? 'fwd' : 'back');
      const c = document.querySelector('.step.cur'); if (c && c.focus) c.focus();  // le focus suit la position
    }
    return;
  }
  if (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft') {
    const cards = [...document.querySelectorAll('.nb')];
    if (!cards.length) return;
    ev.preventDefault();
    nbFocus = ev.key === 'ArrowRight'
      ? (nbFocus + 1) % cards.length
      : (nbFocus <= 0 ? cards.length - 1 : nbFocus - 1);
    cards[nbFocus].focus();
    return;
  }
  if (ev.key === 'Escape') { ev.preventDefault(); back(); return; }
  if (ev.key === 'Enter' && document.activeElement === document.body) {
    const cards = document.querySelectorAll('.nb');
    if (cards.length) { ev.preventDefault(); cards[0].click(); }
  }
});

/* ── Utilitaires ────────────────────────────────────────────────────────── */
function esc(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function copy(txt, btn) {
  const done = () => { const o = btn.textContent; btn.textContent = 'Copié'; setTimeout(() => btn.textContent = o, 1200); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(done, () => fallback());
  } else fallback();
  function fallback() {
    const ta = document.createElement('textarea');
    ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) {}
    ta.remove();
  }
}

/* ── Demarrage ──────────────────────────────────────────────────────────── */
renderFabSel();
const first = model().spine[0];
if (first) { cur = first.dn; renderSpine(); renderObj('fwd'); }
else document.getElementById('stage').innerHTML =
  '<div class="obj"><div class="text-muted">Aucun objet resolu pour ce fabric.</div></div>';
setTimeout(() => { document.body.classList.remove('boot'); }, 1500);
window.addEventListener('resize', paintProgress);
</script>
</body>
</html>
