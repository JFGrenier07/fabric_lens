<!--
  ══════════════════════════════════════════════════════════════════════════════
  CONCEPT — « RIVIÈRE DE ROUTES »
  Le préfixe cherché est un COURANT qui traverse sept colonnes fixes
  (Fabric │ VRF │ L3Out │ ext-EPG │ Rôle │ Contract │ EPG-BD interne). L'épaisseur
  du ruban = qualité du match (exact /24 épais, agrégat /16 fin), la TEXTURE = l'axe
  du scope (plein = sécurité, hachuré = routage, double bande = les deux), et la
  gouttière verticale entre ext-EPG et Rôle est le lit de la rivière : les arcs
  y relient l'annonceur (export-rtctrl) à chaque classificateur (import-security).

  PASSAGE À 20 FABRICS
  La mise en page est purement verticale : chaque fabric consomme (nb de lanes ×
  LANE_PITCH) + FABRIC_GAP px, les 7 colonnes gardent une largeur constante. 20
  fabrics ≈ 25 lanes ≈ 2 200 px de haut : la zone de graphe défile verticalement,
  l'en-tête de colonnes est `position:sticky` et reste lisible. Au-delà de ~12
  fabrics, activer « Replier les fabrics sans match exact » (bouton du bandeau)
  qui réduit chaque fabric non-exact à une lane unique de 1 ligne ; et la gouttière
  inter-fabric passe en mode « arcs à la demande » (seuls les arcs du fabric
  survolé/sélectionné sont tracés) — déjà le comportement des arcs secondaires ici.
  Aucun coût de layout non linéaire : tout est O(nb de lanes).
  ══════════════════════════════════════════════════════════════════════════════
-->

<style>
  /* ── Sémantique dérivée des tokens Nocturne (aucun hex en dur) ───────────── */
  :root{
    --c-sec:        var(--color-accent-400);                                       /* sécurité : violet vif   */
    --c-sec-dim:    color-mix(in srgb, var(--color-accent-400) 55%, var(--color-bg));
    --c-rt:         color-mix(in srgb, var(--color-accent) 38%, var(--color-neutral-400)); /* routage : lilas grisé */
    --c-rt-dim:     color-mix(in srgb, var(--c-rt) 55%, var(--color-bg));
    --c-anom:       color-mix(in srgb, var(--color-accent-200) 62%, var(--color-neutral-500)); /* anomalie : lavé */
    --c-ghost:      color-mix(in srgb, var(--color-text) 46%, transparent);
    --panel-w: 348px;
  }

  html,body{height:100%;}
  body{overflow:hidden;}
  .app{display:flex;flex-direction:column;height:100vh;}

  /* ── Bandeau ──────────────────────────────────────────────────────────────── */
  .topbar{
    display:flex;align-items:center;gap:var(--space-4);
    padding:var(--space-3) var(--space-6);
    box-shadow:0 1px 0 0 var(--color-divider);
    flex:none;
  }
  .brand{

  }
  .topbar h1{font-size:15px;margin:0;letter-spacing:-.01em;}
  .query{
    display:inline-flex;align-items:baseline;gap:var(--space-2);

    box-shadow:0 0 14px -4px color-mix(in srgb, var(--color-accent) 55%, transparent);
  }
  .query .q-lbl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-300);}
  .query .q-val{font-size:14px;}
  .spacer{margin-left:auto;}
  .topbar .btn{white-space:nowrap;}

  /* ── Légende compacte, permanente ─────────────────────────────────────────── */
  .legend{
    display:flex;align-items:center;gap:var(--space-6);flex:none;
    padding:var(--space-2) var(--space-6);
    font-size:11px;color:color-mix(in srgb, var(--color-text) 62%, transparent);
    box-shadow:0 1px 0 0 var(--color-divider);
  }
  .lg{display:inline-flex;align-items:center;gap:6px;}
  .lg svg{display:block;flex:none;}

  /* ── Scène ────────────────────────────────────────────────────────────────── */
  .stage{position:relative;flex:1;min-height:0;}
  .scroll{position:absolute;inset:0;overflow:auto;}
  /* box-sizing:border-box vient de nocturne.css : la largeur doit inclure le padding,

  .canvas{width:calc(1318px + var(--space-6) * 2);position:relative;padding:0 var(--space-6) var(--space-8);}
  .colhead{
    position:sticky;top:0;z-index:3;
    background:linear-gradient(var(--color-bg) 76%, transparent);

  }

  .col-rule{stroke:var(--color-divider);stroke-width:1;}

  /* ── Nœuds ────────────────────────────────────────────────────────────────── */
  .node{cursor:pointer;}
  .node .nbox{
    fill:var(--color-surface);
    stroke:var(--color-neutral-800);stroke-width:1;
  }
  .node:hover .nbox{stroke:var(--color-accent);}
  .node:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px;border-radius:var(--radius-sm);}

  .ghost-text{font-size:10px;fill:var(--c-ghost);font-style:italic;}

  .rb{stroke-width:.75;}
  .rb-sec{fill:color-mix(in srgb, var(--c-sec) 46%, transparent);stroke:var(--c-sec);}

/* ═══════════════════════════════════════════════════════════════════════════
   2. MODÈLE — dérivation des « lanes » (un chemin = une lane)
   ═══════════════════════════════════════════════════════════════════════════ */
const SEC_SCOPES = ['import-security', 'shared-security'];
const RT_SCOPES  = ['export-rtctrl', 'import-rtctrl', 'shared-rtctrl'];
const ROLE_LABEL = { origin:'origine', dr:'DR', transit:'transit', consumer:'consommateur', conflict:'conflit' };

function ipToInt(ip){ return ip.split('.').reduce((a,o)=>(a<<8>>>0)+(+o),0)>>>0; }
function parseCidr(c){ const [ip,len]=c.split('/'); return {net:ipToInt(ip), len:+len}; }
function matchKind(subnetIp, queryCidr){
  const s=parseCidr(subnetIp), q=parseCidr(queryCidr);
  if(subnetIp===queryCidr) return 'exact';
  // 0.0.0.0/0 couvre tout : c'est la route par défaut, pas un match pour ce préfixe.
  if(s.len>0 && s.len<q.len){ const m=(0xFFFFFFFF<<(32-s.len))>>>0;
    if(((s.net&m)>>>0)===((q.net&m)>>>0)) return 'aggregate'; }
  return null;
}
function axes(scopes){
  return { sec: scopes.some(s=>SEC_SCOPES.includes(s)), rt: scopes.some(s=>RT_SCOPES.includes(s)) };
}

const LANES = [];      // chaque lane = un parcours complet gauche → droite
const FABRICS = [];

DATA.fabrics.forEach(fab=>{
  const F = { id:fab.id, raw:fab, lanes:[] };
  fab.l3outs.forEach(l3o=>{
    l3o.extEpgs.forEach(ee=>{
      ee.subnets.forEach(sn=>{
        const kind = matchKind(sn.ip, DATA.query.value);
        if(!kind) return;
        const ax = axes(sn.scope);
        const L = {
          id:'lane-'+LANES.length, fabric:fab, l3out:l3o, extEpg:ee, subnet:sn,
          kind, ax, scopes:sn.scope, anomaly:false,
          thick: kind==='exact' ? 15 : 7
        };
        LANES.push(L); F.lanes.push(L);
      });
    });
  });
  // Cas hors L3Out : le préfixe existe comme gateway de Bridge Domain dans un autre VRF
  if(!F.lanes.length && fab.bd){
    const bdNet = fab.bd.subnet.ip.replace(/\.\d+\/(\d+)$/, '.0/$1');
    if(matchKind(bdNet, DATA.query.value)){
      const L = { id:'lane-'+LANES.length, fabric:fab, l3out:null, extEpg:null,
        subnet:{ip:fab.bd.subnet.ip, scope:[], aggregate:''}, kind:'exact',
        ax:{sec:false,rt:false}, scopes:[], anomaly:true, thick:12 };
      LANES.push(L); F.lanes.push(L);
    }
  }
  if(F.lanes.length) FABRICS.push(F);
});

// Contract : attaché à la lane porteuse d'un axe sécurité, ou à la 1re lane de l'ext-EPG
FABRICS.forEach(F=>{
  const seen = new Set();
  F.lanes.forEach(L=>{
    if(L.anomaly){ L.contract=null; return; }
    const key = L.extEpg.dn;
    const names = [].concat(L.extEpg.provides||[], L.extEpg.consumes||[]);
    if(seen.has(key) || !names.length){ L.contract=null; return; }
    seen.add(key);
    L.contract = { name:names[0], dir:(L.extEpg.provides||[]).length?'provide':'consume', raw:DATA.contracts[names[0]] };
  });
  // EPG/BD interne du fabric (colonne 7)
  F.internal = F.raw.epgs.length ? { epg:F.raw.epgs[0], bd:F.raw.bd } : null;
});

/* Arcs inter-fabric : export-rtctrl (annonceur) → import-security (classificateur) */
const ARCS = [];
const exporters = LANES.filter(L=>L.scopes.includes('export-rtctrl'));
const importers = LANES.filter(L=>L.scopes.includes('import-security'));
exporters.forEach(src=>{
  importers.forEach(dst=>{
    if(src.fabric.id===dst.fabric.id) return;
    ARCS.push({ src, dst, agg: dst.kind==='aggregate',
      primary: src.fabric.role==='origin', id:'arc-'+ARCS.length });
  });
});

/* ═══════════════════════════════════════════════════════════════════════════
   3. LAYOUT
   ═══════════════════════════════════════════════════════════════════════════ */
const W = 1318, LANE_PITCH = 78, FABRIC_GAP = 26, TOP = 16;
const COLS = [
  {key:'fabric', x:0,    w:156, label:'Fabric'},
  {key:'vrf',    x:190,  w:112, label:'VRF'},
  {key:'l3out',  x:336,  w:142, label:'L3Out'},
  {key:'eepg',   x:512,  w:126, label:'ext-EPG'},
  /* gouttière 638 → 768 : le lit de la rivière inter-fabric (130 px) */
  {key:'role',   x:768,  w:182, label:'Rôle du préfixe'},
  {key:'ctr',    x:984,  w:150, label:'Contract'},
  {key:'int',    x:1168, w:150, label:'EPG / BD interne'}
];
const C = {}; COLS.forEach(c=>C[c.key]=c);
const RIVER_X = C.eepg.x + C.eepg.w;                  // 638 — lit de la rivière
const RIVER_W = C.role.x - RIVER_X;                   // 130

let y = TOP;
FABRICS.forEach((F,i)=>{
  F.lanes.forEach(L=>{ L.cy = y + LANE_PITCH/2; y += LANE_PITCH; });
  F.top = F.lanes[0].cy - LANE_PITCH/2; F.bot = y;
  if(i < FABRICS.length-1) y += FABRIC_GAP;
});
const H = y + 24;

const NODES = [];
function node(o){ o.id = o.id || ('n'+NODES.length); NODES.push(o); return o; }
function spanBox(lanes, col, h){
  const a=lanes[0].cy, b=lanes[lanes.length-1].cy;
  return { x:col.x, w:col.w, y:a-(h||44)/2, h:(b-a)+(h||44) };
}

FABRICS.forEach(F=>{
  const ls = F.lanes;
  // col 1 — fabric
  F.nFab = node(Object.assign({kind:'fabric', F, lanes:ls}, spanBox(ls, C.fabric)));
  // col 2 — VRF (groupé par nom)
  const vrfGroups = {};
  ls.forEach(L=>{ const v = L.anomaly ? F.raw.bd.vrf : L.l3out.vrf; (vrfGroups[v] = vrfGroups[v]||[]).push(L); });
  F.nVrf = {};
  Object.keys(vrfGroups).forEach(v=>{
    F.nVrf[v] = node(Object.assign({kind:'vrf', F, vrf:v, lanes:vrfGroups[v]}, spanBox(vrfGroups[v], C.vrf)));
    vrfGroups[v].forEach(L=>L.nVrf = F.nVrf[v]);
  });
  // col 3 / 4 — L3Out et ext-EPG
  const l3Groups = new Map(), eeGroups = new Map();
  ls.forEach(L=>{
    const k3 = L.anomaly ? '∅' : L.l3out.dn, k4 = L.anomaly ? '∅' : L.extEpg.dn;
    if(!l3Groups.has(k3)) l3Groups.set(k3, []); l3Groups.get(k3).push(L);
    if(!eeGroups.has(k4)) eeGroups.set(k4, []); eeGroups.get(k4).push(L);
  });
  l3Groups.forEach((arr)=>{ const n = node(Object.assign({kind:'l3out', F, l3out:arr[0].l3out, lanes:arr, ghost:arr[0].anomaly}, spanBox(arr, C.l3out)));
    arr.forEach(L=>L.nL3 = n); });
  eeGroups.forEach((arr)=>{ const n = node(Object.assign({kind:'eepg', F, extEpg:arr[0].extEpg, lanes:arr, ghost:arr[0].anomaly}, spanBox(arr, C.eepg)));
    arr.forEach(L=>L.nEe = n); });
  // col 5 — rôle du préfixe (une par lane, hauteur variable)
  ls.forEach(L=>{
    const h = L.anomaly ? 54 : 28 + L.scopes.length*15;
    L.nRole = node({kind:'role', F, L, lanes:[L], x:C.role.x, w:C.role.w, y:L.cy-h/2, h});
  });
  // col 6 — contracts
  const ctrGroups = new Map();
  ls.forEach(L=>{ if(!L.contract) return; if(!ctrGroups.has(L.contract.name)) ctrGroups.set(L.contract.name, []); ctrGroups.get(L.contract.name).push(L); });
  ctrGroups.forEach((arr, name)=>{
    const dirs = [...new Set(arr.map(L=>L.contract.dir))];
    const n = node({kind:'ctr', F, name, contract:DATA.contracts[name], lanes:arr, dirs,
      x:C.ctr.x, w:C.ctr.w, y:arr[0].cy-22, h:44});
    arr.forEach(L=>L.nCtr = n);
  });
  // col 7 — EPG / BD interne
  if(F.internal){
    const host = F.lanes.find(L=>L.nCtr) || F.lanes[0];
    F.nInt = node({kind:'int', F, internal:F.internal, lanes:[host],
      x:C.int.x, w:C.int.w, y:host.cy-24, h:48, anom:F.raw.role==='conflict'});
    F.intHost = host;
  }
});

/* Liens (un par lane et par intervalle de colonnes) */
const LINKS = [];
FABRICS.forEach(F=>{
  F.lanes.forEach(L=>{
    LINKS.push({L, a:F.nFab,  b:L.nVrf,  gap:0});
    LINKS.push({L, a:L.nVrf,  b:L.nL3,   gap:1});
    LINKS.push({L, a:L.nL3,   b:L.nEe,   gap:2});
    LINKS.push({L, a:L.nEe,   b:L.nRole, gap:3});
    if(L.nCtr) LINKS.push({L, a:L.nRole, b:L.nCtr, gap:4});
    if(F.nInt && F.intHost===L && L.nCtr && !L.anomaly && lanesBindInternal(F,L))
      LINKS.push({L, a:L.nCtr, b:F.nInt, gap:5});
    if(L.anomaly && F.nInt) LINKS.push({L, a:L.nRole, b:F.nInt, gap:4, wide:true});
  });
});
function lanesBindInternal(F, L){
  if(!F.internal) return false;
  const c = L.contract && L.contract.name;
  const e = F.internal.epg;
  return !!c && ([].concat(e.provides||[], e.consumes||[]).includes(c));
}

/* Allocation des « quais » sur les bords des nœuds (Sankey) */
function allocate(side){
  NODES.forEach(n=>{
    const arr = LINKS.filter(l=> side==='out' ? l.a===n : l.b===n);
    if(!arr.length) return;
    arr.sort((p,q)=> (side==='out'?p.b:p.a).y - (side==='out'?q.b:q.a).y || p.L.cy-q.L.cy);
    const tot = arr.reduce((s,l)=>s+l.L.thick,0) + (arr.length-1)*4;
    let cur = (n.y + n.h/2) - tot/2;
    cur = Math.max(cur, n.y + 5);
    arr.forEach(l=>{ if(side==='out') l.y0 = cur; else l.y1 = cur; cur += l.L.thick + 4; });
  });
}
allocate('out'); allocate('in');

/* — rubans — */
function bandPath(x0,y0,x1,y1,t){
  const xm=(x0+x1)/2;
  return `M${x0},${y0} C${xm},${y0} ${xm},${y1} ${x1},${y1} L${x1},${y1+t} C${xm},${y1+t} ${xm},${y0+t} ${x0},${y0+t} Z`;
}
LINKS.forEach(l=>{
  const L=l.L;
  const g = el('g',{class:'ribbon lane lane-'+L.id+(L.kind==='aggregate'?' lane-agg':''),
                    'data-lane':L.id, 'clip-path':`url(#wipe${l.gap})`}, gRib);
  const x0 = l.a.x + l.a.w, x1 = l.b.x;
  const parts = L.anomaly ? [['anom',1]]
    : (L.ax.sec && L.ax.rt) ? [['sec',.5],['rt',.5]]
    : L.ax.sec ? [['sec',1]] : [['rt',1]];
  let o0=0, o1=0;
  const gapPx = parts.length>1 ? 2.5 : 0;
  const usable = L.thick - gapPx*(parts.length-1);
  parts.forEach(([tex,f])=>{
    const t = usable*f;
    el('path',{d:bandPath(x0, l.y0+o0, x1, l.y1+o1, t), class:'rb rb-'+tex}, g);
    o0+=t+gapPx; o1+=t+gapPx;
  });
  const hit = el('path',{d:bandPath(x0,l.y0,x1,l.y1,L.thick), class:'hit'}, g);
  g.style.pointerEvents='none';
  const ti = el('title',{},hit);
  ti.textContent = laneLabel(L);

/* — arcs inter-fabric — */
/* Le lit de la rivière : un liseré vertical qui matérialise la gouttière. */
(function(){
  const ys = ARCS.flatMap(a=>[a.src.cy, a.dst.cy]);
  if(!ys.length) return;                 // sans arc, Math.min(...[]) = Infinity → y1/y2 = NaN
  const y0=Math.min(...ys)-14, y1=Math.max(...ys)+14;
  el('line',{x1:C.role.x-4, y1:y0, x2:C.role.x-4, y2:y1,
    stroke:'color-mix(in srgb, var(--color-accent) 22%, transparent)','stroke-width':1,
    'stroke-dasharray':'2 5', class:'river-bed'}, gArc);
})();
/* Les arcs partant d'un même nœud s'éventent sur son bord gauche (lecture Sankey). */
const fanOut = new Map(), fanIn = new Map();
ARCS.forEach(A=>{
  fanOut.set(A.src.id,(fanOut.get(A.src.id)||0)+1);
  fanIn.set(A.dst.id,(fanIn.get(A.dst.id)||0)+1);
});
const seenOut = new Map(), seenIn = new Map();
const arcsSorted = ARCS.slice().sort((a,b)=>Math.abs(a.src.cy-a.dst.cy)-Math.abs(b.src.cy-b.dst.cy));
arcsSorted.forEach((A,i)=>{
  const d = 22 + i*14;
  const ko = (seenOut.get(A.src.id)||0); seenOut.set(A.src.id, ko+1);
  const ki = (seenIn.get(A.dst.id)||0);  seenIn.set(A.dst.id, ki+1);
  const sy = A.src.cy + (ko - (fanOut.get(A.src.id)-1)/2)*6.5;
  const ty = A.dst.cy + (ki - (fanIn.get(A.dst.id)-1)/2)*6.5;
  const x=C.role.x;
  const path=`M${x},${sy} C${x-d},${sy} ${x-d},${ty} ${x},${ty}`;
  const g = el('g',{class:'arc'+(A.agg?' agg':'')+(A.primary?'':' secondary'),
                    'data-arc':A.id, 'data-src':A.src.id, 'data-dst':A.dst.id}, gArc);
  const halo = el('path',{d:path, class:'arc-halo', pathLength:1}, g);
  const line = el('path',{d:path, class:'arc-line', pathLength:1}, g);
  // Cadence calée pour que le DERNIER arc finisse avant la coupure d'intro (2,05 s) :
  // 1.05 + 6×0.05 + 0.62 s de tracé ≈ 1,97 s. Sinon les arcs de queue « sautent ».
  [halo,line].forEach(p=>{ p.style.strokeDasharray='1'; p.style.animationDelay=(1.05+i*0.05)+'s'; });
  const mx = x-0.75*d, my=(sy+ty)/2;
  el('circle',{cx:mx, cy:my, r:7.5, class:'arc-dot'}, g);
  txt(g, mx, my+3, 'arc-glyph', A.agg?'≈':'→');
  const t = el('title',{},g);
  t.textContent = `${A.src.fabric.id} annonce ${A.src.subnet.ip} (export-rtctrl) → ${A.dst.fabric.id} le classifie (${A.dst.subnet.ip}, import-security)${A.agg?' — via agrégat':''}`;
});

/* — nœuds — */
function addNode(n){
  const g = el('g',{class:'node '+n.kind+(n.anom||n.kind==='role'&&n.L.anomaly?' anom':''),
    tabindex:0, role:'button', 'data-node':n.id, 'aria-label':nodeAria(n)}, gNode);
  n.el = g;
  g.style.animationDelay = (0.05 + COLS.findIndex(c=>c.x===n.x)*0.055 + (n.y/H)*0.28)+'s';
  const box = el('rect',{x:n.x, y:n.y, width:n.w, height:n.h, rx:8, class:'nbox'}, g);
  if(n.ghost){ box.setAttribute('fill','transparent'); box.setAttribute('stroke','var(--c-ghost)'); box.setAttribute('stroke-dasharray','4 4'); }
  drawNode(n, g);
  g.addEventListener('mouseenter', ()=>{ if(!pinned) focusNode(n); });
  g.addEventListener('mouseleave', ()=>{ if(!pinned) clearFocus(); });
  g.addEventListener('focus', ()=>focusNode(n));
  // sans ce pendant, quitter un nœud au clavier laissait la scène figée en mode
  // « focusing » (tout le reste à 16 % d'opacité) sans aucun moyen d'en sortir.
  g.addEventListener('blur', ()=>{ if(!pinned) clearFocus(); });
  g.addEventListener('click', ()=>openPanel(n));
  g.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openPanel(n); } });
}

      // vignette de texture à gauche du badge

      .setAttribute('font-size','9');

function nodeAria(n){
  switch(n.kind){
    case 'fabric': return `Fabric ${n.F.id}, site ${n.F.raw.site}, rôle ${ROLE_LABEL[n.F.raw.role]}`;
    case 'vrf': return `VRF ${n.vrf} du fabric ${n.F.id}`;
    case 'l3out': return n.ghost?`Fabric ${n.F.id} : aucun L3Out`:`L3Out ${n.l3out.name} du fabric ${n.F.id}`;
    case 'eepg': return n.ghost?`Fabric ${n.F.id} : aucun ext-EPG`:`ext-EPG ${n.extEpg.name} du fabric ${n.F.id}`;
    case 'role': return laneLabel(n.L);
    case 'ctr': return `Contract ${n.name}, ${n.dirs.length>1?'fourni et consommé':n.dirs[0]==='provide'?'fourni':'consommé'} par les ext-EPG du fabric ${n.F.id}`;
    case 'int': return `EPG interne ${n.internal.epg.name}, encap ${n.internal.epg.encap}, fabric ${n.F.id}`;
  }
  return n.kind;
}
function laneLabel(L){
  if(L.anomaly) return `Anomalie : ${L.fabric.id}, ${L.subnet.ip} en gateway de Bridge Domain dans ${L.fabric.bd.vrf}, aucun L3Out`;
  return `${L.fabric.id} · ${L.subnet.ip} · ${L.scopes.join(' + ')}${L.kind==='aggregate'?' (match par agrégat)':''}`;
}
NODES.forEach(addNode);

/* — étiquettes fantômes col.7 pour les fabrics sans EPG interne — */
FABRICS.forEach(F=>{
  if(F.internal) return;
  const t = txt(gNode, C.int.x, F.lanes[0].cy+4, 'ghost-text', 'aucun EPG interne');
  t.style.animationDelay='0.5s';
});

/* ═══════════════════════════════════════════════════════════════════════════
   5. INTERACTION — focus + contexte, panneau, clavier
   ═══════════════════════════════════════════════════════════════════════════ */
const stage = document.getElementById('stage');
let pinned = null;

function laneSet(lanes){
  // Extension d'UN saut seulement (jamais transitive) : le résultat ne dépend donc
  // pas de l'ordre des arcs. Survoler l'annonceur montre toute la rivière ; survoler
  // un classificateur montre d'où le préfixe lui arrive.
  const seed = new Set(lanes.map(l=>l.id));
  const set = new Set(seed);
  ARCS.forEach(A=>{
    if(seed.has(A.src.id)) set.add(A.dst.id);
    if(seed.has(A.dst.id)) set.add(A.src.id);
  });
  return set;
}
function applyFocus(lanes){
  const set = laneSet(lanes);
  stage.classList.add('focusing');
  svg.querySelectorAll('.lane').forEach(e=>e.classList.toggle('hot', set.has(e.dataset.lane)));
  NODES.forEach(n=>n.el.classList.toggle('hot', n.lanes.some(l=>set.has(l.id))));
  gArc.querySelectorAll('.arc').forEach(e=>{
    const A = ARCS.find(a=>a.id===e.dataset.arc);
    e.classList.toggle('hot', set.has(A.src.id) && set.has(A.dst.id));
  });
}
function focusLane(L){ applyFocus([L]); }
function focusNode(n){ applyFocus(n.lanes); }
function clearFocus(){
  stage.classList.remove('focusing');
  svg.querySelectorAll('.hot').forEach(e=>e.classList.remove('hot'));
}

/* — panneau de détail — */
const panel = document.getElementById('panel');
const pBody = document.getElementById('p-body');
let selNode = null;
function esc(s){ return String(s).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function kv(rows){ return '<dl class="kv">'+rows.map(([k,v])=>`<dt>${esc(k)}</dt><dd class="mono">${esc(v)}</dd>`).join('')+'</dl>'; }
function dn(label, d){ return `<div class="dnbox mono"><span>${esc(label)}</span>${esc(d)}</div>`; }

function openPanel(n){
  selNode = n; pinned = n;
  NODES.forEach(x=>x.el.classList.toggle('sel', x===n));
  applyFocus(n.lanes);
  document.getElementById('p-kick').textContent = {
    fabric:'fabric', vrf:'fvCtx · VRF', l3out:'l3extOut', eepg:'l3extInstP · ext-EPG',
    role:'l3extSubnet', ctr:'vzBrCP · contract', int:'fvAEPg · fvBD'
  }[n.kind] || n.kind;
  document.getElementById('p-title').textContent = panelTitle(n);
  pBody.innerHTML = panelBody(n);
  panel.classList.add('open');
  panel.removeAttribute('inert'); panel.removeAttribute('aria-hidden');
  panel.focus();
}
function closePanel(){
  // relevé AVANT de poser `inert`, qui déplace immédiatement le focus vers <body>
  const back = selNode, hadFocus = panel.contains(document.activeElement);
  panel.classList.remove('open'); pinned=null; selNode=null;
  panel.setAttribute('inert',''); panel.setAttribute('aria-hidden','true');
  NODES.forEach(x=>x.el.classList.remove('sel'));
  clearFocus();
  if(back && back.el && hadFocus) back.el.focus();   // rendre le focus à l'objet cliqué
}
function panelTitle(n){
  return { fabric:n.F&&n.F.id, vrf:n.vrf, l3out:n.ghost?'—':n.l3out&&n.l3out.name,
    eepg:n.ghost?'—':n.extEpg&&n.extEpg.name, role:n.L&&n.L.subnet.ip,
    ctr:n.name, int:n.internal&&n.internal.epg.name }[n.kind] || '';
}
function panelBody(n){
  const F = n.F, f = F.raw;
  let h='';
  if(n.kind==='fabric'){
    h += kv([['site',f.site],['rôle',ROLE_LABEL[f.role]],['APIC',f.apicVersion],
      ['backup',f.backupTs],['L3Outs',f.l3outs.length],['EPGs',f.epgs.length],
      ['lanes trouvées',F.lanes.length]]);
    if(f.role==='conflict') h += `<div class="note"><b>Anomalie.</b> Le préfixe existe ici en <span class="mono">gateway de Bridge Domain</span> (<span class="mono">${esc(f.bd.subnet.ip)}</span>) dans le tenant <span class="mono">${esc(f.bd.tenant)}</span> / VRF <span class="mono">${esc(f.bd.vrf)}</span>, sans aucun L3Out. Le <span class="mono">vlan-2110</span> y est réutilisé pour un usage sans rapport.</div>`;
  } else if(n.kind==='vrf'){
    h += kv([['VRF',n.vrf],['tenant', f.bd&&f.bd.vrf===n.vrf ? f.bd.tenant : (n.lanes[0].l3out ? n.lanes[0].l3out.dn.split('/')[1].replace('tn-','') : '—')],
      ['lanes',n.lanes.length]]);
  } else if(n.kind==='l3out'){
    if(n.ghost){ h += `<div class="note">Ce fabric n'expose <b>aucun L3Out</b> : le préfixe n'y est ni annoncé ni classifié.</div>`; }
    else { const o=n.l3out;
      h += kv([['name',o.name],['VRF',o.vrf],['L3 domain',o.domain.split('-').slice(1).join('-')],
        ['enforceRtctrl',o.enforceRtctrl],['border leaves',o.nodes.join(', ')],['ext-EPGs',o.extEpgs.length]]);
      h += dn('dn · l3extOut', o.dn); }
  } else if(n.kind==='eepg'){
    if(n.ghost){ h += `<div class="note">Aucun <b>ext-EPG</b> dans ce fabric.</div>`; }
    else { const e=n.extEpg;
      h += kv([['name',e.name],['prefGrMemb',e.prefGrMemb],
        ['provides',(e.provides||[]).join(', ')||'—'],['consumes',(e.consumes||[]).join(', ')||'—']]);
      h += '<h6>l3extSubnet</h6>' + e.subnets.map(s=>
        `<div class="mono" style="font-size:12px">${esc(s.ip)} <span class="text-muted">— ${esc(s.scope.join(', '))}</span></div>`).join('');
      h += dn('dn · l3extInstP', e.dn); }
  } else if(n.kind==='role'){
    const L=n.L;
    if(L.anomaly){
      const bd=f.bd;
      h += kv([['objet','fvSubnet (BD gateway)'],['ip',bd.subnet.ip],['scope',bd.subnet.scope],
        ['BD',bd.name],['tenant',bd.tenant],['VRF',bd.vrf],['unicastRoute',bd.unicastRoute],
        ['arpFlood',bd.arpFlood],['unkMacUcastAct',bd.unkMacUcastAct]]);
      h += `<div class="note"><b>Conflit d'adressage.</b> Même réseau <span class="mono">10.21.10.0/24</span>, gateway <span class="mono">.254</span> au lieu de <span class="mono">.1</span>, dans un VRF distinct (<span class="mono">Legacy_VRF</span>). Aucun chemin inter-fabric : ce n'est pas la même instance du subnet.</div>`;
      h += dn('dn · fvBD', bd.dn);
    } else {
      h += kv([['ip',L.subnet.ip],['aggregate',L.subnet.aggregate||'(vide)'],
        ['match', L.kind==='exact'?'exact':'par agrégat'],['scopes',L.scopes.join(', ')],
        ['ext-EPG',L.extEpg.name],['L3Out',L.l3out.name]]);
      h += '<h6>Lecture des scopes</h6>';
      h += L.scopes.map(s=>`<div style="font-size:12px;margin-bottom:6px"><span class="mono" style="color:var(--color-accent-300)">${esc(s)}</span><br><span class="text-muted">${esc(DATA.scopeLegend[s])}</span></div>`).join('');
      if(L.kind==='aggregate') h += `<div class="note"><b>Match par agrégat.</b> Le préfixe configuré est <span class="mono">${esc(L.subnet.ip)}</span> : il couvre la requête mais ne la désigne pas. Toute adresse de <span class="mono">10.21.0.0/16</span> tombe dans cet ext-EPG.</div>`;
      h += dn('dn · l3extInstP (parent)', L.extEpg.dn);
    }
  } else if(n.kind==='ctr'){
    const c=n.contract;
    h += kv([['name',n.name],['scope',c.scope],
      ['relation', n.dirs.length>1 ? 'provided ET consumed dans ce fabric'
        : n.dirs[0]==='provide' ? 'provided par l\'ext-EPG' : 'consumed par l\'ext-EPG'],
      ['ext-EPG liés', n.lanes.map(L=>L.extEpg.name).join(', ')]]);
    if(n.dirs.length>1) h += `<div class="note"><b>Charnière de transit.</b> Le même contract est <span class="mono">provided</span> par un ext-EPG et <span class="mono">consumed</span> par l'autre dans le même fabric : c'est ce qui autorise le trafic à traverser <span class="mono">${esc(n.F.id)}</span>.</div>`;
    c.subjects.forEach(s=>{
      h += `<h6>subject ${esc(s.name)}</h6>`;
      h += '<table class="table"><tbody>' + s.filters.map(fl=>
        `<tr><td class="mono">${esc(fl.name)}</td><td class="mono text-muted">${esc(fl.etherT)}/${esc(fl.prot)}</td><td class="mono">${esc(fl.dFromPort)}${fl.dFromPort!==fl.dToPort?'–'+esc(fl.dToPort):''}</td></tr>`).join('') + '</tbody></table>';
    });
    h += dn('dn · vzBrCP', c.dn);
  } else if(n.kind==='int'){
    const e=n.internal.epg, bd=n.internal.bd;
    h += kv([['EPG',e.name],['application profile',e.ap],['encap',e.encap],
      ['déploiement', e.deployment==='aaep'?'via AAEP (pas de static port)':'static port'],
      ['paths', e.paths.length ? e.paths.map(p=>p.tDn).join(' ') : '—'],
      ['AAEP', e.aaep||'—'],['domain', e.domain]]);
    if(bd) h += '<h6>Bridge Domain</h6>' + kv([['name',bd.name],['tenant',bd.tenant],['VRF',bd.vrf],
      ['subnet',bd.subnet.ip],['scope',bd.subnet.scope],['unicastRoute',bd.unicastRoute],
      ['arpFlood',bd.arpFlood],['unkMacUcastAct',bd.unkMacUcastAct]]);
    if(e.deployment==='aaep') h += `<div class="note"><b>Encap différent.</b> Cet EPG est déployé par l'AAEP <span class="mono">SRV.AAEP</span> et non par un static port, avec l'encap <span class="mono">${esc(e.encap)}</span> — l'origine utilise <span class="mono">vlan-2110</span>. Aucun contract ne le relie au chemin externe.</div>`;
    if(n.anom) h += `<div class="note"><b>VLAN réutilisé.</b> <span class="mono">vlan-2110</span> sert ici à un EPG du tenant <span class="mono">Legacy</span>, sans rapport avec le chemin de production.</div>`;
    h += dn('dn · fvAEPg', e.dn);
    if(bd) h += dn('dn · fvBD', bd.dn);
  }
  return h;
}

document.getElementById('p-close').addEventListener('click', closePanel);
document.getElementById('btn-reset').addEventListener('click', ()=>{ closePanel(); stage.classList.remove('arcs-all'); btnArcs.setAttribute('aria-pressed','false'); });
const btnArcs = document.getElementById('btn-arcs');
btnArcs.addEventListener('click', ()=>{
  const on = stage.classList.toggle('arcs-all');
  btnArcs.setAttribute('aria-pressed', String(on));
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closePanel(); });

document.getElementById('hitcount').textContent = FABRICS.length+' fabrics';
document.getElementById('qval').textContent = DATA.query.value;

/* ── Fin de l'animation d'entrée : la scène devient calme et statique ──────── */
const REPLAY = ()=>{
  stage.classList.remove('intro'); void stage.offsetWidth;
  stage.classList.add('intro');
  clearTimeout(REPLAY._t);
  REPLAY._t = setTimeout(()=>stage.classList.remove('intro'), 2050);
};
document.getElementById('btn-replay').addEventListener('click', REPLAY);
setTimeout(()=>stage.classList.remove('intro'), 2050);
</script>
