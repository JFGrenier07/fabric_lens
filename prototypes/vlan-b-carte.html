<title>Fabric Lens — VLAN 100 · Carte &amp; loupe</title>
<!--
  Fabric Lens — recherche VLAN — MODELE B « la carte et la loupe ».

  MODELE DE NAVIGATION (3 lignes)
  1. La barre laterale gauche est la CARTE : l'arbre complet du chemin (chaine access
     policies + chaine logique) est affiche en entier, en permanence, position courante marquee.
  2. La zone centrale est le TERRITOIRE : le graphe du chemin entier est dessine une seule fois
     et ne se redessine jamais ; seule la LOUPE (viewBox + mise au point) se deplace.
  3. Selectionner un objet (arbre, graphe, voisin, clavier) allume cet objet + ses voisins
     immediats, attenue le reste, et remplit le panneau bas avec ses attributs bruts et son DN.

  DEGRADATION A 200 OBJETS
  Le layout est en colonnes fixes par « kind » (rang ACI), donc le cout est O(n) et le graphe
  ne se reorganise jamais : a 200 objets il devient haut, pas illisible. Trois soupapes sont
  deja en place et suffisent : (a) la loupe zoome sur un voisinage de ~3,5 colonnes, donc la
  lisibilite ne depend pas du nombre total de noeuds ; (b) l'arbre lateral passe en
  defilement vertical (overflow-y:auto) et reste la carte de reference ; (c) les objets hors
  voisinage tombent a opacity .3. Ce qu'il faudrait ajouter au-dela de ~120 objets : replier
  les colonnes homogenes (« 14 port blocks » en un seul noeud groupe, deplie a la demande),
  et n'injecter dans le DOM SVG que les colonnes intersectant la viewBox courante.
-->
<style>
/* Nocturne — design-system tokens and component classes.
   Source: Claude Design project "Cisco ACI Policy Analyzer"
   (_ds/nocturne-6dbba83f-ae08-459a-8073-fe7f5074721f/styles.css)
   This file is the source of truth for the look. */
/* Pas d'@import distant : les prototypes doivent se charger hors ligne (un @import
   vers fonts.googleapis.com bloque le rendu jusqu'au timeout réseau). La pile
   --font-heading / --font-body utilise Inter si elle est installée localement,
   sinon system-ui — même résultat qu'aujourd'hui sur une machine hors ligne. */

:root {
  --color-bg: #161826;
  --color-surface: #232532;
  --color-text: #e9e9ed;
  --color-accent: #9184d9;
  --color-accent-2: #a7a1db;
  --color-divider: color-mix(in srgb, #e9e9ed 16%, transparent);

  /* Tonal ramps — generated in OKLCH on one shared lightness scale. */

  --color-neutral-200: #e4e7f5;
  --color-neutral-300: #cfd3e5;
  --color-neutral-400: #b2b6ca;
  --color-neutral-500: #9397ab;
  --color-neutral-600: #75798c;
  --color-neutral-700: #595d6c;
  --color-neutral-800: #3f424d;
  --color-neutral-900: #292b31;

  --color-accent-100: #f5f4ff;
  --color-accent-200: #e7e5fe;
  --color-accent-300: #d2cefd;
  --color-accent-400: #b5abfc;
  --color-accent-500: #968ae0;
  --color-accent-600: #796cbf;
  --color-accent-700: #5d5294;
  --color-accent-800: #423a6a;
  --color-accent-900: #2b2741;

  --color-accent-2-100: #f5f4ff;
  --color-accent-2-200: #e7e5fe;
  --color-accent-2-300: #d2cefd;
  --color-accent-2-400: #b5afe8;
  --color-accent-2-500: #9690c9;
  --color-accent-2-600: #7972a9;
  --color-accent-2-700: #5c5783;
  --color-accent-2-800: #423e5d;
  --color-accent-2-900: #2b293a;

  --color-section: #262a60;
  --color-section-glow: #353b80;
  --color-section-ghost: #4c5397;

  --font-heading: "Inter", system-ui, sans-serif;
  --font-heading-weight: 500;
  --font-body: "Inter", system-ui, sans-serif;

  --space-1: 2.8px;
  --space-2: 5.6px;
  --space-3: 8.4px;
  --space-4: 11.2px;
  --space-6: 16.8px;
  --space-8: 22.4px;

  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 14px;

  --shadow-sm: 0 0 0 1px #3f424d;
  --shadow-md: 0 0 0 1px #595d6c, 0 6px 18px rgba(0,0,0,0.55);
  --shadow-lg: 0 0 0 1px #9397ab, 0 16px 40px rgba(0,0,0,0.65);
}

body {
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-body);
}

.lighten { mix-blend-mode: lighten; background-color: transparent; }

/* ── Base ─────────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }
h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);
}
h1 { font-size: 42px; }
h2 { font-size: 32px; }
h3 { font-size: 25px; }
h4 { font-size: 20px; }
h5 { font-size: 16px; }
h6 { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; }
p { margin: 0 0 var(--space-3); }
a { color: var(--color-accent); text-underline-offset: 3px; }
img { display: block; max-width: 100%; }
figure { margin: 0; }
figcaption {
  font-size: 11px; margin-top: var(--space-1);
  color: color-mix(in srgb, var(--color-text) 55%, transparent);
}
.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }
.mono { font-family: ui-monospace, SFMono-Regular, "Cascadia Mono", Consolas, Menlo, monospace; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }

/* ── Rules ────────────────────────────────────────────────────────────── */
.hr {
  height: 1px; border: 0; margin: var(--space-4) 0;
  background: linear-gradient(to right,
    transparent, var(--color-divider) 48px,
    var(--color-divider) calc(100% - 48px), transparent);
}

/* ── Buttons ──────────────────────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  cursor: pointer; text-decoration: none;
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 14px; line-height: 1.2; color: var(--color-text);
  background: transparent; border: 1px solid transparent;
  padding: var(--space-2) calc(var(--space-3) * 1.2);
  border-radius: var(--radius-md);
}
.btn svg { display: block; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { color: var(--color-accent); border-color: var(--color-accent); }
.btn-primary:hover { background: color-mix(in srgb, var(--color-accent) 12%, transparent); }
.btn-primary:active { background: color-mix(in srgb, var(--color-accent) 22%, transparent); }
.btn-secondary { border-color: var(--color-divider); }
.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }
.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }
.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }
.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }
.btn-icon { width: 36px; height: 36px; padding: 0; }
.btn-block { width: 100%; margin-top: var(--space-2); }

/* ── Forms ────────────────────────────────────────────────────────────── */
.field > label {
  display: block; font-size: 12px; margin-bottom: 5px;
  color: color-mix(in srgb, var(--color-text) 70%, transparent);
}
.input {
  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;
  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);
  background: var(--color-surface);
  border: 1px solid var(--color-divider); border-radius: var(--radius-md);
}
.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }
.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }
textarea.input { min-height: 90px; resize: vertical; }
.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }
.radio input, .seg-opt input {
  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;
}
.radio .dot {
  width: 16px; height: 16px; flex: none; border-radius: 50%;
  border: 1.5px solid var(--color-divider);
}
.radio:hover .dot { border-color: var(--color-accent); }
.radio input:checked + .dot {
  border-color: var(--color-accent); background: var(--color-accent);
  box-shadow: inset 0 0 0 4px var(--color-bg);
}
.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }
.seg {
  display: inline-flex; overflow: hidden;
  border: 1px solid var(--color-divider); border-radius: var(--radius-md);
}
.seg-opt {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 12px; font-size: 13px; cursor: pointer;
}
.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }
.seg-opt:has(input:checked) { color: var(--color-accent); box-shadow: inset 0 0 0 1px var(--color-accent); }
.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }

/* ── Cards ────────────────────────────────────────────────────────────── */
.card {
  display: flex; flex-direction: column; gap: var(--space-2);
  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);
}
.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }
.card-title {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 17px; line-height: 1.2;
}
.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }
.card-meta {
  display: flex; align-items: center; gap: 6px; font-size: 11px;
  color: color-mix(in srgb, var(--color-text) 50%, transparent);
}
.elev-sm { box-shadow: var(--shadow-sm); }
.elev-md { box-shadow: var(--shadow-md); }
.elev-lg { box-shadow: var(--shadow-lg); }

/* ── Tags ─────────────────────────────────────────────────────────────── */
.tag {
  display: inline-flex; align-items: center; font-size: 11px;
  letter-spacing: 0.02em; padding: 3px 10px;
  border-radius: calc(var(--radius-md) * 0.75);
}
.tag-accent { background: var(--color-accent-800); color: var(--color-accent-100); }
.tag-accent-2 { background: var(--color-accent-2-800); color: var(--color-accent-2-100); }
.tag-neutral { background: var(--color-neutral-800); color: var(--color-neutral-100); }
.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }

/* ── Navigation ───────────────────────────────────────────────────────── */
.nav {
  display: flex; align-items: center; gap: var(--space-4);
  padding: var(--space-3) var(--space-4);
  border-bottom: none;
}
.nav-brand {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 18px; margin-right: auto;
}
.nav a { color: inherit; text-decoration: none; font-size: 14px; }
.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }

/* ── Tables ───────────────────────────────────────────────────────────── */
.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table th {
  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
  color: color-mix(in srgb, var(--color-text) 60%, transparent);
  padding: var(--space-2); border-bottom: 1px solid transparent;
}
.table td { padding: var(--space-2); border-bottom: 1px solid transparent; }
.table thead tr {
  background: linear-gradient(to right,
    transparent, var(--color-divider) 48px,
    var(--color-divider) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px;
}
.table tbody tr {
  background: linear-gradient(to right,
    transparent, color-mix(in srgb, var(--color-text) 8%, transparent) 48px,
    color-mix(in srgb, var(--color-text) 8%, transparent) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px;
}
.table tbody tr:hover {
  background:
    linear-gradient(color-mix(in srgb, var(--color-text) 4%, transparent),
                    color-mix(in srgb, var(--color-text) 4%, transparent)) no-repeat 0 0 / 100% 100%,
    linear-gradient(to right,
      transparent, color-mix(in srgb, var(--color-text) 8%, transparent) 48px,
      color-mix(in srgb, var(--color-text) 8%, transparent) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px;
}

/* ── Dialog ───────────────────────────────────────────────────────────── */
.dialog-backdrop {
  position: fixed; inset: 0; display: grid; place-items: center;
  padding: var(--space-4);
  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);
}
.dialog {
  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);
  padding: var(--space-4); border-radius: var(--radius-lg);
  background: var(--color-surface); box-shadow: var(--shadow-lg);
}
.dialog-title {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 20px;
}
.dialog-body { font-size: 14px; opacity: 0.85; }
.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }

/* ── Chrome de l'ecran ─────────────────────────────────────────────────── */
html, body { height: 100%; }
/* Pas de min-width : sous 1280px la colonne carte se resserre au lieu de pousser
   le graphe hors d'un body en overflow:hidden (contenu alors injoignable). */
body { overflow: hidden; }

#app {
  display: grid;
  grid-template-columns: clamp(212px, 21vw, 296px) minmax(0, 1fr);
  grid-template-rows: auto 1fr;
  height: 100vh;
  opacity: 0;
  animation: appin .5s cubic-bezier(.22,.61,.36,1) .12s forwards;
}
@keyframes appin { from { opacity: 0; transform: scale(.994); } to { opacity: 1; transform: none; } }

.topbar {
  grid-column: 1 / -1; min-width: 0;
  display: flex; align-items: center; gap: var(--space-6);
  padding: var(--space-3) var(--space-6);
  background: linear-gradient(to right,
    transparent, var(--color-divider) 48px,
    var(--color-divider) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px;
}
.brand { display: flex; align-items: center; gap: var(--space-3); flex: none; }
.brand-dot {
  width: 26px; height: 26px; flex: none; display: grid; place-items: center;
  border-radius: var(--radius-sm);
  background: var(--color-accent-900); color: var(--color-accent-300);
  font-size: 11px; letter-spacing: .06em;
  box-shadow: 0 0 0 1px var(--color-accent-800), 0 0 14px -4px var(--color-accent);
}
.brand-name { font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 14px; }
.brand-sub { font-size: 11px; color: var(--color-neutral-500); }

.query {
  display: flex; align-items: baseline; gap: var(--space-2); flex: none;
  padding: var(--space-1) var(--space-4);
  border: 1px solid var(--color-accent-800); border-radius: var(--radius-md);
  box-shadow: 0 0 16px -8px var(--color-accent);
}
.query-k { font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--color-neutral-500); }
.query-v { font-size: 15px; color: var(--color-accent-300); }

/* les 5 onglets fabric doivent pouvoir se resserrer : sinon, sous ~1200px, ils
   poussaient le bouton « Rejouer » hors de l'ecran. */
.fabtabs {
  display: flex; gap: var(--space-2); margin-left: auto;
  min-width: 0; flex: 0 1 auto; overflow-x: auto; scrollbar-width: none;
}
.fabtabs::-webkit-scrollbar { display: none; }
.fabtab {
  cursor: pointer; font: inherit; font-size: 11.5px; color: var(--color-neutral-400);
  flex: none; white-space: nowrap;
  background: transparent; border: 1px solid var(--color-divider);
  border-radius: var(--radius-md); padding: 4px var(--space-3);
  display: flex; align-items: center; gap: 6px;
}
.fabtab:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); color: var(--color-text); }
.fabtab[aria-pressed="true"] {
  color: var(--color-accent-300); border-color: var(--color-accent);
  box-shadow: 0 0 14px -6px var(--color-accent);
}
.fabtab .st { width: 5px; height: 5px; border-radius: 50%; background: var(--color-neutral-600); }
.fabtab[data-status="deployed"] .st { background: var(--color-accent); box-shadow: 0 0 6px var(--color-accent); }
.topbar .btn { font-size: 12px; flex: none; }
@media (max-width: 1180px) {
  .brand-sub { display: none; }
  .topbar { gap: var(--space-4); }
}

/* ── Carte : arbre lateral ─────────────────────────────────────────────── */
.map {
  display: flex; flex-direction: column; min-height: 0;
  background: linear-gradient(to bottom,
    transparent, var(--color-divider) 48px,
    var(--color-divider) calc(100% - 48px), transparent) no-repeat right / 1px 100%;
}
.map-head { padding: var(--space-3) var(--space-4) var(--space-1); }
.map-title { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--color-accent); }
.map-sum { font-size: 11px; color: var(--color-neutral-400); margin-top: 2px; }
.tree { flex: 1; min-height: 0; overflow-y: auto; padding: 0 var(--space-2) var(--space-4); }
.tree-sec {
  font-size: 9px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--color-neutral-600);
  padding: var(--space-2) var(--space-2) 1px;
  display: flex; justify-content: space-between; align-items: baseline;
}
.row {
  display: flex; align-items: center; gap: 6px; width: 100%;
  height: 17px; padding: 0 var(--space-2) 0 0;
  border: 0; border-radius: var(--radius-sm); background: transparent;
  color: var(--color-neutral-300); font: inherit; font-size: 10.5px;
  text-align: left; cursor: pointer;
  border-left: 2px solid transparent;
}
.row:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); color: var(--color-text); }
.row .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 10.5px; }
.row .cls { font-size: 8.5px; color: var(--color-neutral-600); white-space: nowrap; letter-spacing: .04em; }
.row .bul { width: 4px; height: 4px; flex: none; border-radius: 50%; background: var(--color-neutral-700); }
.row[data-target="1"] .bul { background: var(--color-accent); box-shadow: 0 0 5px var(--color-accent); }
.row[data-ghost="1"] { color: var(--color-neutral-600); }
.row[data-ghost="1"] .lbl { font-size: 9.5px; }
.row[data-near="1"] { color: var(--color-text); background: color-mix(in srgb, var(--color-text) 5%, transparent); }
.row[aria-current="true"] {
  border-left-color: var(--color-accent);
  background: color-mix(in srgb, var(--color-accent) 14%, transparent);
  color: var(--color-accent-100);
}
.row[aria-current="true"] .cls { color: var(--color-accent-400); }
.map-foot { padding: var(--space-2) var(--space-4) var(--space-3); font-size: 10px; color: var(--color-neutral-600); }

/* ── Territoire : graphe + panneau ─────────────────────────────────────── */
.stage { display: grid; grid-template-rows: 1fr auto; min-height: 0; min-width: 0; }
.canvas { position: relative; min-height: 0; min-width: 0; }
.canvas svg { width: 100%; height: 100%; display: block; }
.canvas-tools {
  position: absolute; top: var(--space-4); right: var(--space-4);
  display: flex; gap: var(--space-2); z-index: 2;
}
.canvas-tools .btn { font-size: 11.5px; background: color-mix(in srgb, var(--color-bg) 82%, transparent); }
.hint {
  position: absolute; left: var(--space-6); bottom: var(--space-3);
  font-size: 10px; color: var(--color-neutral-600);
}
.hint kbd {
  font-family: ui-monospace, Consolas, monospace; font-size: 9.5px;
  border: 1px solid var(--color-neutral-800); border-radius: 3px; padding: 0 3px;
  color: var(--color-neutral-400);
}

.lane-band { fill: color-mix(in srgb, var(--color-text) 3%, transparent); }
.lane-name { fill: var(--color-neutral-600); font-size: 8.5px; letter-spacing: .14em; text-transform: uppercase; }

.edge { fill: none; stroke: var(--color-neutral-800); stroke-width: 1; transition: stroke .3s, opacity .3s, stroke-width .3s; }
.edge.cross { stroke-dasharray: 3 3; stroke: var(--color-neutral-700); }
.edge.dim { opacity: .28; }
.edge.hot { stroke: var(--color-accent); stroke-width: 1.6; opacity: 1; }
.edge-lbl {
  fill: var(--color-accent-300); font-size: 7.5px; letter-spacing: .04em;
  opacity: 0; transition: opacity .3s;
  /* halo couleur fond : l'etiquette reste lisible meme au-dessus d'une carte */
  stroke: var(--color-bg); stroke-width: 2.6px; paint-order: stroke fill;
}
.edge-lbl.on { opacity: .9; }

.node { cursor: pointer; transition: opacity .34s ease; }
.node .box {
  fill: var(--color-surface); stroke: var(--color-neutral-800); stroke-width: 1;
  transition: stroke .3s, stroke-width .3s;
}
.node .kick { fill: var(--color-neutral-500); font-size: 6.8px; letter-spacing: .11em; text-transform: uppercase; }
.node .name { fill: var(--color-text); font-size: 10px; }
.node .note { fill: var(--color-accent-300); font-size: 7.4px; opacity: 0; transition: opacity .3s; }
.node .tgt { fill: var(--color-accent); opacity: 0; }
.node[data-target="1"] .tgt { opacity: 1; }
.node:hover .box { stroke: var(--color-neutral-600); }
.node.dim { opacity: .3; }

/* ── Construction du modele par fabric ─────────────────────────────────── */
function build(fab) {
  const nodes = [], byDn = new Map();
  const out = new Map(), inc = new Map();
  for (const e of fab.edges) {
    if (!fab.nodes[e.from] || !fab.nodes[e.to]) continue;
    (out.get(e.from) || out.set(e.from, []).get(e.from)).push(e);
    (inc.get(e.to) || inc.set(e.to, []).get(e.to)).push(e);
  }
  // colonnes reellement utilisees -> compactees (pas de colonne vide a l'ecran)
  const used = new Set();
  for (const dn in fab.nodes) used.add(COL[fab.nodes[dn].kind] ?? 5);
  const colIdx = new Map([...used].sort((a, b) => a - b).map((c, i) => [c, i]));

  const slots = new Map(); // "lane:col" -> count
  const laneRows = [0, 0];
  for (const dn in fab.nodes) {
    const n = fab.nodes[dn];
    const lane = LANE[n.kind] ?? 1, col = colIdx.get(COL[n.kind] ?? 5);
    const key = lane + ':' + col, k = slots.get(key) || 0;
    slots.set(key, k + 1);
    laneRows[lane] = Math.max(laneRows[lane], k + 1);
    const ghost = n.matchesQuery === false;
    const o = { dn, n, lane, col, slot: k, ghost, w: ghost ? GW : NW, h: ghost ? GH : NH };
    nodes.push(o); byDn.set(dn, o);
  }
  const laneY = [34, 0];
  const laneH = [laneRows[0] * PITCH_Y, laneRows[1] * PITCH_Y];
  laneY[1] = laneY[0] + laneH[0] + 46;
  for (const o of nodes) {
    o.x = PAD + o.col * PITCH_X + (NW - o.w) / 2;
    o.cy = laneY[o.lane] + (laneRows[o.lane] - (slots.get(o.lane + ':' + o.col))) / 2 * PITCH_Y
         + o.slot * PITCH_Y + PITCH_Y / 2;
    o.y = o.cy - o.h / 2;
    o.target = o.n.matchesQuery === true || o.n.kind === 'encapBlk' ||
               (o.n.attrs && o.n.attrs.encap === 'vlan-' + DATA.query.value);
  }
  const width = PAD * 2 + (colIdx.size - 1) * PITCH_X + NW;
  const height = laneY[1] + laneH[1] + 24;
  const edges = fab.edges.filter(e => byDn.has(e.from) && byDn.has(e.to));
  return { fab, nodes, byDn, edges, out, inc, width, height, laneY, laneH, laneRows, colIdx };
}

/* ── Arbre lateral : deux DFS, un par chaine ───────────────────────────── */
function buildTree(M) {
  const rows = [], seen = new Set();
  const walk = (dn, depth, lane) => {
    if (seen.has(dn)) return;
    seen.add(dn);
    rows.push({ dn, depth, lane });
    for (const e of (M.out.get(dn) || [])) {
      const t = M.byDn.get(e.to);
      if (t && t.lane === lane) walk(e.to, depth + 1, lane);
    }
  };
  const secA = [], secB = [];
  const mark = arr => { const s = rows.length; return () => arr.push(...rows.slice(s)); };
  let cut = mark(secA);
  for (const r of M.fab.roots) if (M.byDn.has(r)) walk(r, 0, 0);
  for (const o of M.nodes) if (o.lane === 0 && !seen.has(o.dn)) walk(o.dn, 0, 0);
  cut();
  cut = mark(secB);
  for (const o of M.nodes) if (o.lane === 1 && o.n.kind === 'epg') walk(o.dn, 0, 1);
  for (const o of M.nodes) if (o.lane === 1 && !seen.has(o.dn)) walk(o.dn, 0, 1);
  cut();
  return [secA, secB];
}

      width: M.width - 12, height: M.laneH[l] + 20 }));
    const t = el('text', { class: 'lane-name', x: 16, y: M.laneY[l] - 20 });
    t.textContent = LANE_NAME[l]; svg.appendChild(t);
  }

  const gE = el('g', {}), gL = el('g', {}), gN = el('g', {});
  svg.append(gE, gL, gN);

  // Deux relations qui aboutissent au meme objet, du meme cote, recevaient jusqu'ici
  // des coordonnees d'etiquette IDENTIQUES (ex. « filter » depuis deux subjects, ou
  // « pool utilise par le domaine » + « domaine associe » sur un domaine) : les deux
  // textes se superposaient des que l'objet cible etait selectionne. On empile.
  const lblSlot = new Map();
  M.edges.forEach((e, i) => {
    const a = M.byDn.get(e.from), b = M.byDn.get(e.to);
    const x1 = a.x + a.w, y1 = a.cy, x2 = b.x, y2 = b.cy;
    let d;
    if (x2 - x1 > 12) {
      const m = (x2 - x1) * .5;
      d = `M${x1} ${y1} C${x1 + m} ${y1} ${x2 - m} ${y2} ${x2} ${y2}`;
    } else { // lien qui remonte (ex. EPG -> domain) : on l'ecarte par le bas
      const s = (y2 > y1 ? 1 : -1) * 34;
      d = `M${x1} ${y1} C${x1 + 60} ${y1 + s} ${x2 - 60} ${y2 - s} ${a.x} ${y2}`;
      if (x2 < a.x) d = `M${a.x} ${y1} C${a.x - 70} ${y1 + s} ${b.x + b.w + 70} ${y2 - s} ${b.x + b.w} ${y2}`;
    }
    const cross = a.lane !== b.lane;
    const p = el('path', { class: 'edge' + (cross ? ' cross' : ''), d, 'data-i': i });
    const len = Math.hypot(x2 - x1, y2 - y1) * 1.6 + 40;
    if (intro) {
      p.style.setProperty('--len', len);
      p.style.strokeDasharray = len;
      p.style.animationDelay = (a.col * 70 + 140) + 'ms';
    }
    e._el = p; gE.appendChild(p);
    // L'etiquette est posee a l'ARRIVEE (juste au-dessus de l'objet cible) : chaque
    // relation a donc une place unique, meme quand un EPG porte 6 liens sortants.
    // Etiquette posee a l'ARRIVEE : chaque relation a une place unique, meme quand un
    // EPG porte 6 liens. Si l'espace inter-colonnes est trop mince, on la pose dans la
    // gouttiere horizontale, juste au-dessus de l'objet cible — jamais sur une carte.
    const gap = b.x - (a.x + a.w);
    const side = gap >= 60 ? 'r' : 't';
    const key = e.to + '|' + side;
    const rank = lblSlot.get(key) || 0;
    lblSlot.set(key, rank + 1);
    const dy = rank * 9;                       // empilement vers le haut, hors de la carte
    const lb = side === 'r'
      ? el('text', { class: 'edge-lbl', x: b.x - 5, y: b.cy - 6 - dy, 'text-anchor': 'end' })
      : el('text', { class: 'edge-lbl', x: b.x + 1, y: b.y - 5 - dy, 'text-anchor': 'start' });
    lb.textContent = trunc(e.label || e.rel, 22);
    e._lbl = lb; gL.appendChild(lb);
  });

  for (const o of M.nodes) {
    const g = el('g', { class: 'node' + (o.ghost ? ' ghost' : ''), tabindex: -1, role: 'button',
      'data-dn': o.dn, 'data-target': o.target ? 1 : 0 });
    if (intro) { g.style.animationDelay = (o.col * 70) + 'ms'; }
    g.appendChild(el('rect', { class: 'box', x: o.x, y: o.y, width: o.w, height: o.h, rx: 6 }));
    g.appendChild(el('circle', { class: 'tgt', cx: o.x + 7, cy: o.y + 7, r: 2.6 }));
    const k = el('text', { class: 'kick', x: o.x + (o.target ? 14 : 9), y: o.y + (o.ghost ? 9.5 : 11.5) });
    k.textContent = trunc((o.n.clsLabel || o.n.cls).toUpperCase(), 20);
    const nm = el('text', { class: 'name mono', x: o.x + 9, y: o.y + (o.ghost ? 20 : 25) });
    nm.textContent = trunc(o.n.label, o.ghost ? 20 : 19);
    const ti = el('title'); ti.textContent = o.n.label + '\n' + o.dn;
    g.append(k, nm, ti);
    if (o.n.note) {
      const nt = el('text', { class: 'note mono', x: o.x + 9, y: o.y + o.h + 9 });
      nt.textContent = trunc(o.n.note, 30); g.appendChild(nt);
    }
    g.addEventListener('click', () => select(o.dn));
    o._el = g; gN.appendChild(g);
  }
  c.appendChild(svg);
  return svg;
}

/* ── La loupe : on n'anime que le viewBox ──────────────────────────────── */
function setVB(t, dur) {
  const svg = $('#canvas svg'); if (!svg) return;
  if (anim) cancelAnimationFrame(anim);
  const from = vb || t;
  if (!dur) { vb = t; svg.setAttribute('viewBox', t.join(' ')); return; }
  const t0 = performance.now();
  const step = now => {
    const p = Math.min(1, (now - t0) / dur);
    const e = p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
    vb = from.map((v, i) => v + (t[i] - v) * e);
    svg.setAttribute('viewBox', vb.map(v => v.toFixed(1)).join(' '));
    if (p < 1) anim = requestAnimationFrame(step);
  };
  anim = requestAnimationFrame(step);
}
function overviewVB() { return [0, 0, M.width, M.height]; }
function loupeVB(o) {
  const c = $('#canvas');
  // Si le canvas n'est pas encore mesure (premiere frame, onglet en arriere-plan),
  // clientHeight vaut 0 -> ar = 0 -> hauteur de viewBox 0 -> graphe invisible.
  let ar = c.clientHeight / Math.max(1, c.clientWidth);
  if (!isFinite(ar) || ar <= 0.02) ar = 0.6;
  let w = Math.min(M.width, PITCH_X * 3.6), h = w * ar;
  if (h > M.height) { h = M.height; w = Math.min(M.width, h / ar); }
  let x = o.x + o.w / 2 - w / 2, y = o.cy - h / 2;
  x = Math.max(-10, Math.min(M.width - w + 10, x));
  y = Math.max(-10, Math.min(M.height - h + 10, y));
  return [x, y, w, h];
}
function applyZoom(dur) {
  const o = M.byDn.get(sel);
  setVB(mode === 'over' || !o ? overviewVB() : loupeVB(o), dur);
  $('#btn-over').classList.toggle('btn-primary', mode === 'over');
  $('#btn-over').classList.toggle('btn-secondary', mode !== 'over');
  $('#btn-loupe').classList.toggle('btn-primary', mode === 'loupe');
  $('#btn-loupe').classList.toggle('btn-secondary', mode !== 'loupe');
}

/* ── Mise au point ─────────────────────────────────────────────────────── */
function focusPaint() {
  const near = new Set([sel]);
  for (const e of M.edges) {
    if (e.from === sel) near.add(e.to);
    if (e.to === sel) near.add(e.from);
  }
  for (const o of M.nodes) {
    const g = o._el, is = o.dn === sel;
    g.classList.toggle('sel', is);
    g.classList.toggle('near', !is && near.has(o.dn));
    g.classList.toggle('dim', !near.has(o.dn));
  }
  for (const e of M.edges) {
    const hot = e.from === sel || e.to === sel;
    e._el.classList.toggle('hot', hot);
    e._el.classList.toggle('dim', !hot);
    e._lbl.classList.toggle('on', hot);
  }
  for (const r of document.querySelectorAll('.row')) {
    r.setAttribute('aria-current', r.dataset.dn === sel);
    r.dataset.near = (r.dataset.dn !== sel && near.has(r.dataset.dn)) ? 1 : 0;
  }
  const cur = document.querySelector('.row[aria-current="true"]');
  if (cur) cur.scrollIntoView({ block: 'nearest' });
}

function renderPanel() {
  const o = M.byDn.get(sel); if (!o) return;
  const n = o.n;
  $('#p-kick').textContent = n.clsLabel || '';
  $('#p-name').textContent = n.label;
  $('#p-cls').textContent = n.cls;
  $('#p-note').textContent = n.note || '';
  $('#p-dn').textContent = o.dn;
  $('#p-ident').innerHTML = [
    ['Classe ACI', n.cls], ['Type', n.clsLabel || '—'], ['Nom', n.label],
    ['Rôle', n.note || '—'],
    ['Correspond au VLAN ' + DATA.query.value,
      n.matchesQuery === false ? 'non — autre encapsulation' : (o.target ? 'oui' : '—')]
  ].map(([k, v]) => `<tr><td class="k">${esc(k)}</td><td class="v mono">${esc(v)}</td></tr>`).join('');
  const at = n.attrs || {};
  const ks = Object.keys(at).sort();
  $('#p-attrs').innerHTML = ks.length
    ? ks.map(k => `<tr><td class="k mono">${esc(k)}</td><td class="v mono">${esc(at[k])}</td></tr>`).join('')
    : '<tr><td class="k">aucun attribut exporté</td></tr>';

  const box = $('#p-nbrs'); box.innerHTML = '';
  const add = (e, dir) => {
    const other = M.byDn.get(dir === 'out' ? e.to : e.from);
    const b = document.createElement('button');
    b.className = 'nbr'; b.type = 'button';
    b.innerHTML = `<span class="rel">${esc(e.label || e.rel)}</span><span class="arw">${dir === 'out' ? '→' : '←'}</span>` +
                  `<span class="n mono">${esc(other.n.label)}</span>`;
    b.title = other.dn;
    b.onclick = () => select(other.dn);
    box.appendChild(b);
  };
  M.edges.forEach(e => { if (e.from === sel) add(e, 'out'); });
  M.edges.forEach(e => { if (e.to === sel) add(e, 'in'); });
  if (!box.children.length) box.innerHTML = '<div class="text-muted" style="font-size:11px">objet terminal</div>';
}

function select(dn, push = true) {
  if (!M.byDn.has(dn) || dn === sel) return;
  if (push && sel) hist.push(sel);
  sel = dn;
  focusPaint(); renderPanel(); applyZoom(520);
}

/* ── Carte laterale ────────────────────────────────────────────────────── */
function renderTree() {
  TREE = buildTree(M);
  FLAT = [];
  const t = $('#tree'); t.innerHTML = '';
  const names = ['Chaîne access policies', 'Chaîne logique'];
  TREE.forEach((sec, i) => {
    if (!sec.length) return;
    const h = document.createElement('div');
    h.className = 'tree-sec';
    h.innerHTML = `<span>${names[i]}</span><span>${sec.length}</span>`;
    t.appendChild(h);
    for (const r of sec) {
      const o = M.byDn.get(r.dn), n = o.n;
      const b = document.createElement('button');
      b.className = 'row'; b.type = 'button';
      b.dataset.dn = r.dn;
      b.dataset.target = o.target ? 1 : 0;
      b.dataset.ghost = o.ghost ? 1 : 0;
      b.style.paddingLeft = (4 + r.depth * 9) + 'px';
      b.title = n.label + (n.note ? ' — ' + n.note : '') + '\n' + r.dn;
      b.innerHTML = `<span class="bul"></span><span class="lbl mono">${esc(n.label)}</span>` +
                    `<span class="cls">${esc(n.clsLabel || n.cls)}</span>`;
      b.onclick = () => select(r.dn);
      t.appendChild(b);
      FLAT.push({ dn: r.dn, depth: r.depth, el: b });
    }
  });
}

/* ── Fabrics ───────────────────────────────────────────────────────────── */
function renderTabs() {
  const box = $('#fabtabs'); box.innerHTML = '';
  DATA.fabrics.forEach((f, i) => {
    const b = document.createElement('button');
    b.className = 'fabtab'; b.type = 'button';
    b.setAttribute('aria-pressed', i === fabIdx);
    b.dataset.status = f.status;
    b.innerHTML = `<span class="st"></span><span class="mono">${esc(f.id)}</span>`;
    b.title = f.summary + ' · ' + f.backup.file;
    b.onclick = () => switchFabric(i);
    box.appendChild(b);
  });
}
function equivalent(prev) {
  if (!prev) return null;
  let c = M.nodes.find(o => o.n.kind === prev.kind && o.n.label === prev.label);
  if (!c) c = M.nodes.find(o => o.n.kind === prev.kind);
  return c ? c.dn : null;
}
function switchFabric(i, intro) {
  const f = DATA.fabrics[i];
  if (!f || !f.nodes || !Object.keys(f.nodes).length) return;
  const prevO = M && sel ? M.byDn.get(sel) : null;   // sel peut avoir ete invalide
  const prev = prevO ? prevO.n : null;
  fabIdx = i;
  if (introTimer) { clearTimeout(introTimer); introTimer = null; }
  M = build(f);
  hist = [];
  renderTabs(); renderTree();
  $('#map-sum').innerHTML = `<span class="mono">${esc(f.id)}</span> · ${esc(f.summary)} · ` +
    `<span class="mono">${M.nodes.length}</span> objets`;
  $('#map-foot').innerHTML = `Backup <span class="mono">${esc(f.backup.file)}</span><br>résolu le ` +
    `<span class="mono">${esc(f.backup.generatedAt.replace('T', ' ').replace('Z', ' UTC'))}</span>`;
  const svg = renderGraph(!!intro);
  const root = (f.roots || []).find(r => M.byDn.has(r));
  sel = equivalent(prev) || root || M.nodes[0].dn;
  vb = null;
  mode = intro ? 'over' : mode;
  setVB(overviewVB(), 0);
  focusPaint(); renderPanel();
  if (intro) {
    // un « Rejouer » pendant l'intro precedente laissait deux minuteries concurrentes
    introTimer = setTimeout(() => {
      introTimer = null;
      svg.classList.remove('intro');
      // l'intro a fini de tracer : on rend la main au rendu statique (ecran calme)
      M.edges.forEach(e => { e._el.style.strokeDasharray = ''; e._el.style.animationDelay = ''; });
      M.nodes.forEach(o => { o._el.style.animationDelay = ''; });
      mode = 'loupe'; applyZoom(620);
    }, 1250);
  } else {
    applyZoom(0);
  }
}

/* ── Clavier ───────────────────────────────────────────────────────────── */
function idxOf(dn) { return FLAT.findIndex(r => r.dn === dn); }
addEventListener('keydown', ev => {
  if (!FLAT || !FLAT.length) return;
  if (ev.target && ev.target.matches && ev.target.matches('input, textarea')) return;
  const i = idxOf(sel);            // -1 possible : aucune ligne courante
  const here = i >= 0 ? FLAT[i] : null;
  if (ev.key === 'ArrowDown') { if (i < FLAT.length - 1) select(FLAT[i + 1].dn); ev.preventDefault(); }
  else if (ev.key === 'ArrowUp') { if (i > 0) select(FLAT[i - 1].dn); ev.preventDefault(); }
  else if (ev.key === 'ArrowRight') {
    const n = FLAT[i + 1];
    // sans `here`, FLAT[-1].depth levait un TypeError et tuait le clavier
    if (n && (!here || n.depth > here.depth)) select(n.dn);
    ev.preventDefault();
  } else if (ev.key === 'ArrowLeft') {
    if (here) for (let k = i - 1; k >= 0; k--) if (FLAT[k].depth < here.depth) { select(FLAT[k].dn); break; }
    ev.preventDefault();
  } else if (ev.key === 'Enter') {
    mode = 'loupe'; applyZoom(520);
    $('#panel').classList.remove('closed');
    $('#btn-panel').textContent = 'Masquer ▾';
    ev.preventDefault();
  } else if (ev.key === 'Escape') {
    if (hist.length) select(hist.pop(), false);
    else { mode = 'over'; applyZoom(520); }
    ev.preventDefault();
  }
});

/* ── Boutons ───────────────────────────────────────────────────────────── */
$('#btn-over').onclick = () => { mode = 'over'; applyZoom(520); };
$('#btn-loupe').onclick = () => { mode = 'loupe'; applyZoom(520); };
$('#btn-panel').onclick = e => {
  const p = $('#panel'), c = p.classList.toggle('closed');
  e.target.textContent = c ? 'Attributs ▴' : 'Masquer ▾';
  e.target.setAttribute('aria-expanded', !c);
  requestAnimationFrame(() => applyZoom(320));
};
$('#btn-copy').onclick = async () => {
  const dn = $('#p-dn').textContent;
  try { await navigator.clipboard.writeText(dn); }
  catch (_) {
    const ta = document.createElement('textarea');
    ta.value = dn; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
  }
  const c = $('#p-copied'); c.hidden = false; setTimeout(() => c.hidden = true, 1400);
};
$('#btn-replay').onclick = () => switchFabric(fabIdx, true);
addEventListener('resize', () => applyZoom(0));

/* ── Demarrage ─────────────────────────────────────────────────────────── */
$('#qval').textContent = DATA.query.value;
switchFabric(0, true);
</script>
