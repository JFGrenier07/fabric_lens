<!--
  FABRIC LENS — CONCEPT A · « CONSTELLATION ORBITALE »
  ====================================================
  CONCEPT (3 lignes)
  Le préfixe cherché est un noyau lumineux au centre ; les fabrics gravitent autour de lui
  et leur POSITION SUR L'AXE HORIZONTAL est l'information : à gauche ceux qui ANNONCENT le
  préfixe (export-rtctrl / routage), à droite ceux qui le CLASSIFIENT (import-security /
  sécurité), au sommet ceux qui font les deux. Les arcs lumineux traversant le noyau sont
  les chemins inter-fabric (annonceur → classificateur) ; ce qui n'a pas d'orbite (conflit
  de VRF) est physiquement détaché en bas de scène.

  PASSAGE À 20 FABRICS (dégradation contrôlée, implémentée)
  - `layout()` place les fabrics sur UNE ellipse tant qu'il y en a ≤ 9 ; au-delà il en
    répartit une partie sur une ellipse intérieure (rayon ×0.58) en alternance, ce qui
    double la capacité angulaire sans changer la sémantique de l'axe.
  - Au-delà de 9 fabrics en orbite, la scène passe en mode `.dense` : les capsules perdent
    leur ligne de contexte et leurs libellés d'axe (les pastilles route/sécurité restent),
    la typo descend d'un cran. 20 capsules denses tiennent dans la scène à 1280px.
  - Les fabrics « hors orbite » (anomalies) sont empilés dans une gouttière au bas de la
    scène, pas dispersés : ils restent lisibles même s'il y en a 5.
  - Les arcs sont O(annonceurs × classificateurs). Au-delà de 40 arcs, `MAX_ARCS` bascule
    l'affichage sur « arcs du fabric survolé / ouvert uniquement » (le reste est estompé à
    l'ouverture de toute façon) — voir la constante ARC_DIM_THRESHOLD.

  CONTRAINTES : fichier autonome, aucun réseau, SVG + CSS + JS vanilla, Chromium/WebView2.
-->

<style>
/* ─────────────────────────────────────────────────────────────────────────────
   Couleurs sémantiques dérivées UNIQUEMENT des tokens Nocturne.
   Axe ROUTAGE  = accent saturé (violet)   ·  Axe SÉCURITÉ = accent délavé (givre)
   Deux luminances opposées dans la même famille : lisibles sans légende.
   ───────────────────────────────────────────────────────────────────────────── */
:root {
  --fl-route:      var(--color-accent-400);
  --fl-route-dim:  color-mix(in srgb, var(--color-accent-400) 40%, transparent);
  --fl-sec:        color-mix(in srgb, var(--color-neutral-200) 76%, var(--color-accent-400));

  --fl-ink-faint:  color-mix(in srgb, var(--color-text) 62%, transparent);
  --fl-line:       var(--color-divider);
  --fl-card-bg:    color-mix(in srgb, var(--color-surface) 88%, var(--color-bg));

html, body { height: 100%; }
body { overflow-x: auto; overflow-y: hidden; }

/* ── Chrome ──────────────────────────────────────────────────────────────── */
.app { display: flex; flex-direction: column; height: 100vh; min-width: 1280px; }

.topbar {

/* ── Grille principale ───────────────────────────────────────────────────── */
.main { flex: 1; min-height: 620px; display: grid; grid-template-columns: minmax(0,1fr) 348px; }

/* ── Scène ───────────────────────────────────────────────────────────────── */
.scene { position: relative; overflow: hidden; min-height: 0; }
.arcs { position: absolute; inset: 0; width: 100%; height: 100%; }
.arcs path, .arcs ellipse, .arcs line { vector-effect: non-scaling-stroke; fill: none; }

.orbit-guide { stroke: var(--fl-line); stroke-width: 1; stroke-dasharray: 2 7; opacity: .55; }
.axis-line   { stroke: var(--fl-line); stroke-width: 1; stroke-dasharray: 1 6; opacity: .8; }

/* Arc = deux traits superposés (lueur large + trait net) : pas de filtre, pas de
   déformation dans l'espace non uniforme du viewBox. */
.arc-halo { stroke-width: 7; opacity: .10; }
.arc-core { stroke-width: 1.4; opacity: .85; }
.arc[data-kind="exact"]  .arc-halo,
.arc[data-kind="exact"]  .arc-core { stroke: var(--color-accent); }

/* Axe : libellés de bord — la scène porte le sens, pas une légende flottante. */

/* ── Noyau : le préfixe ──────────────────────────────────────────────────── */
.core {
  position: absolute; left: 50%; top: 46%; transform: translate(-50%,-50%);
  width: 178px; height: 178px; border-radius: 50%; display: grid;

/* ── Capsule fabric ──────────────────────────────────────────────────────── */
.fab {
  position: absolute; width: 232px; z-index: 2;
  transform: translate(calc(-50% + var(--dx,0px)), calc(-50% + var(--dy,0px)));

  box-shadow: var(--shadow-sm), 0 4px 16px color-mix(in srgb, var(--color-neutral-900) 62%, transparent);
  transition: box-shadow .3s ease, opacity .3s ease, width .38s cubic-bezier(.22,.7,.3,1),

  border: 1px solid transparent;
}

  opacity: .95;
}
.fab.route::after { --edge-l: var(--fl-route); }
.fab.sec::after   { --edge-r: var(--fl-sec); }

.fab-btn {
  display: block; width: 100%; text-align: left; cursor: pointer; color: inherit;
  background: none; border: 0; font: inherit; padding: var(--space-3) var(--space-4);
  border-radius: var(--radius-lg);

.fab-line1 { display: flex; align-items: center; gap: var(--space-2); }

.fab-role {

}
.fab-sub { font-size: 11px; color: var(--fl-ink-soft); margin-top: 2px; }
/* Mode dense (> 9 fabrics en orbite) : on ne garde que l'identité et les pastilles d'axe. */
.dense .fab-sub, .dense .fab-role, .dense .ax-approx .t { display: none; }
.dense .fab.is-open .fab-sub, .dense .fab.is-open .fab-role,

/* ═══════════════════════════════════════════════════════════════════════════
   1 · Analyse — classification des scopes sur deux axes orthogonaux
   ═══════════════════════════════════════════════════════════════════════════ */
const AXIS = {                        // scope ACI → axe + sens + glose FR
  "import-security": { axis: "sec",   dir: "in",  fr: "classifie l'entrant", shared: false },
  "shared-security": { axis: "sec",   dir: "in",  fr: "classifie (inter-VRF)", shared: true },
  "export-rtctrl":   { axis: "route", dir: "out", fr: "annoncé vers l'extérieur", shared: false },
  "shared-rtctrl":   { axis: "route", dir: "out", fr: "annoncé (inter-VRF)", shared: true },
  "import-rtctrl":   { axis: "route", dir: "in",  fr: "route importée", shared: false }
};

const ip2int = s => s.split(".").reduce((a, o) => ((a << 8) >>> 0) + (+o), 0) >>> 0;
const maskOf = l => (l === 0 ? 0 : (0xFFFFFFFF << (32 - l)) >>> 0) >>> 0;
function cidr(c) { const p = c.split("/"); return { n: (ip2int(p[0]) & maskOf(+p[1])) >>> 0, len: +p[1] }; }
function contains(a, b) { return a.len <= b.len && ((b.n & maskOf(a.len)) >>> 0) === a.n; }

const Q = cidr(DATA.query.value);

/* Pour chaque fabric : quels l3extSubnet matchent, exactement ou par agrégat. */
const model = DATA.fabrics.map(f => {
  const hits = [];
  (f.l3outs || []).forEach(l3 => l3.extEpgs.forEach(ee => ee.subnets.forEach(sn => {
    const c = cidr(sn.ip);
    /* 0.0.0.0/0 englobe tout : c'est un catch-all, pas une décision prise SUR ce préfixe.
       Il reste affiché dans l'ext-EPG mais ne pèse ni sur l'axe ni sur les chemins. */
    if (c.n === Q.n && c.len === Q.len)      hits.push({ l3, ee, sn, match: "exact" });
    else if (contains(c, Q) && c.len > 0)    hits.push({ l3, ee, sn, match: "aggregate" });
  })));
  const scopes = new Set();
  hits.forEach(h => h.sn.scope.forEach(s => scopes.add(s)));
  const nRoute = [...scopes].filter(s => AXIS[s] && AXIS[s].axis === "route").length;
  const nSec   = [...scopes].filter(s => AXIS[s] && AXIS[s].axis === "sec").length;

  const advertises  = [...scopes].some(s => s === "export-rtctrl" || s === "shared-rtctrl");
  const classifies  = [...scopes].some(s => s === "import-security" || s === "shared-security");
  const exact       = hits.some(h => h.match === "exact");
  const onlyApprox  = hits.length > 0 && !exact;

  /* Conflit : le préfixe existe sur un Bridge Domain d'un autre VRF, sans aucun L3Out
     pour le porter — le fabric ne peut donc participer à aucun chemin inter-fabric. */
  let bdOverlap = null;
  if (f.bd) {
    const b = cidr(f.bd.subnet.ip);
    if (b.n === Q.n && b.len === Q.len) bdOverlap = f.bd;
  }
  return { f, hits, scopes: [...scopes], nRoute, nSec, advertises, classifies, exact, onlyApprox, bdOverlap };
});

const byId = Object.fromEntries(model.map(m => [m.f.id, m]));
const refVrf   = (model.find(m => m.advertises && m.f.bd) || {}).f;
const refVrfName = refVrf ? refVrf.bd.vrf : "Prod_VRF";
const refEncap = (() => { const o = model.find(m => m.advertises && m.f.epgs.length); return o ? o.f.epgs[0].encap : null; })();

model.forEach(m => {
  m.conflict = m.hits.length === 0 && !!m.bdOverlap && m.bdOverlap.vrf !== refVrfName;
  m.inOrbit  = m.hits.length > 0;
  m.encapDrift = m.f.epgs.length && refEncap && m.f.epgs[0].encap !== refEncap ? m.f.epgs[0].encap : null;
});

/* Chemins inter-fabric : un annonceur → chaque classificateur. */
const paths = [];
model.filter(a => a.advertises).forEach(a =>
  model.filter(b => b.classifies && b.f.id !== a.f.id).forEach(b =>
    paths.push({ from: a, to: b, kind: b.exact ? "exact" : "approx" })));

/* ═══════════════════════════════════════════════════════════════════════════
   2 · Layout orbital — la position PORTE le sens
   angle 180° = routage pur (gauche) · 0/-40° = sécurité pure (droite) · 90° = les deux
   ═══════════════════════════════════════════════════════════════════════════ */
const CX = 500, CY = 460, RX = 345, RY = 310;   /* espace normalisé 0..1000 */
const ARC_DIM_THRESHOLD = 40;

function layout(orbit) {
  const scored = orbit.map(m => {
    const t = m.nRoute + m.nSec || 1;
    return { m, score: (m.nSec - m.nRoute) / t };
  });
  scored.sort((a, b) => a.score - b.score || (a.m.exact === b.m.exact ? a.m.f.id.localeCompare(b.m.f.id) : (a.m.exact ? -1 : 1)));

  /* regroupe les ex aequo et les éventaille autour de leur angle de base */
  const groups = new Map();
  scored.forEach(s => {
    const k = s.score.toFixed(2);
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(s);
  });
  const dense = orbit.length > 9;
  let ai = 0;
  groups.forEach((g, k) => {
    /* Amplitude 180° et non 220° : score −1 (routage pur) → 180° (gauche),
       score +1 (sécurité pure) → 0° (droite), score 0 → 90° (sommet). Avec 220°
       la base « sécurité pure » tombait à −40°, et l'éventail d'un groupe de trois
       ex aequo poussait le troisième à −88° — c'est-à-dire en bas au centre, dans
       la bande visuelle de la gouttière « hors orbite ». Un fabric purement
       sécurité se retrouvait donc là où la scène dit « aucun chemin ». */
    const base = 180 - ((+k + 1) / 2) * 180;
    const step = dense ? 26 : 48;
    g.forEach((s, i) => {
      const ang = (base + ((g.length - 1) / 2 - i) * step) * Math.PI / 180;
      /* > 9 fabrics : une orbite sur deux passe sur l'ellipse intérieure */
      const k2 = (dense && ai % 2 === 1) ? 0.58 : 1;
      s.m.pos = { x: CX + RX * k2 * Math.cos(ang), y: CY - RY * k2 * Math.sin(ang) };
      ai++;
    });
  });
  return dense;
}

const orbit  = model.filter(m => m.inOrbit);
const offOrb = model.filter(m => !m.inOrbit);
const DENSE  = layout(orbit);
offOrb.forEach((m, i) => { m.pos = { x: 172 + i * 200, y: 862 }; });

/* ═══════════════════════════════════════════════════════════════════════════
   3 · Rendu
   ═══════════════════════════════════════════════════════════════════════════ */
const scene = document.getElementById("scene");
const svg   = document.getElementById("arcs");
const SVGNS = "http://www.w3.org/2000/svg";
if (DENSE) scene.classList.add("dense");

document.getElementById("q-val").textContent  = DATA.query.value;
document.getElementById("core-v").textContent = DATA.query.value;
document.getElementById("core-m").textContent = orbit.length + " fabrics · " + paths.length + " chemins";
document.getElementById("core").setAttribute("aria-label",
  "Préfixe recherché " + DATA.query.value + " — " + orbit.length + " fabrics en orbite, " +
  paths.length + " chemins inter-fabric. Activer pour revenir à la vue d'ensemble.");
document.getElementById("q-count").textContent = "présent dans " + model.length + " fabrics";

function el(tag, cls, txt) { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
function svgEl(tag, attrs) { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; }

/* Glyphes directionnels : la flèche SORT d'une barre (routage) ou ENTRE dans une barre
   (sécurité). Lu sans légende, à toutes les tailles. */
function glyph(kind) {
  const s = document.createElementNS(SVGNS, "svg");
  s.setAttribute("viewBox", "0 0 16 14"); s.setAttribute("aria-hidden", "true");
  const d = kind === "route" ? "M2.5 2.5 V11.5 M5 7 H12.5 M10 4.5 L12.5 7 L10 9.5"
                             : "M2.5 7 H10 M7.5 4.5 L10 7 L7.5 9.5 M13.5 2.5 V11.5";
  s.appendChild(svgEl("path", { d, class: "g" }));
  return s;
}
function scopeChip(scope) {
  const a = AXIS[scope] || { axis: "route", fr: scope, shared: false };
  const c = el("span", "sc " + a.axis + (a.shared ? " shared" : ""));
  c.appendChild(glyph(a.axis));
  const n = el("span", "mono", scope); c.appendChild(n);
  c.title = (DATA.scopeLegend[scope] || scope);
  c.setAttribute("aria-label", scope + " — " + a.fr);
  return c;
}

/* ── Arcs ────────────────────────────────────────────────────────────────── */
function arcPath(a, b) {
  const bow = (p, q, k) => {
    const mx = (p.x + q.x) / 2, my = (p.y + q.y) / 2;
    const dx = q.x - p.x, dy = q.y - p.y, L = Math.hypot(dx, dy) || 1;
    return { x: mx + (-dy / L) * k, y: my + (dx / L) * k };
  };
  const c = { x: CX, y: CY };
  const q1 = bow(a, c, 34), q2 = bow(c, b, 34);
  return `M ${a.x} ${a.y} Q ${q1.x} ${q1.y} ${c.x} ${c.y} Q ${q2.x} ${q2.y} ${b.x} ${b.y}`;
}

const arcEls = [];
paths.forEach((p, i) => {
  const g = svgEl("g", { class: "arc", "data-kind": p.kind, "data-from": p.from.f.id, "data-to": p.to.f.id,
    role: "img", "aria-label": "Chemin inter-fabric : " + p.from.f.id + " annonce " + DATA.query.value +
      ", " + p.to.f.id + " le classifie" + (p.kind === "approx" ? " par agrégat" : "") });
  const d = arcPath(p.from.pos, p.to.pos);
  g.appendChild(svgEl("path", { d, class: "arc-halo" }));
  g.appendChild(svgEl("path", { d, class: "arc-core" }));
  g.style.setProperty("--ai", i);
  svg.appendChild(g); arcEls.push({ g, p });
});

/* Attache rompue pour les fabrics hors orbite : même préfixe, aucun chemin possible. */
offOrb.forEach(m => {
  const g = svgEl("g", { class: "arc", "data-kind": "broken", "data-to": m.f.id, role: "img",
    "aria-label": m.f.id + " : préfixe présent mais dans un autre VRF, aucun chemin inter-fabric" });
  g.appendChild(svgEl("path", { d: arcPath({ x: CX, y: CY - 4 }, m.pos), class: "arc-core" }));
  g.style.setProperty("--ai", paths.length + 2);   /* tracé après l'apparition de la capsule */
  svg.appendChild(g); arcEls.push({ g, p: { from: null, to: m, kind: "broken" } });
});

if (paths.length > ARC_DIM_THRESHOLD) scene.classList.add("arc-quiet");

svg.insertBefore(svgEl("ellipse", { cx: CX, cy: CY, rx: RX, ry: RY, class: "orbit-guide" }), svg.firstChild);
if (DENSE) svg.insertBefore(svgEl("ellipse", { cx: CX, cy: CY, rx: RX * .58, ry: RY * .58, class: "orbit-guide" }), svg.firstChild);
svg.insertBefore(svgEl("line", { x1: 30, y1: CY, x2: 970, y2: CY, class: "axis-line" }), svg.firstChild);

/* longueur de tracé pour l'animation d'entrée */
svg.querySelectorAll(".arc path").forEach(p => {
  try { p.style.setProperty("--len", Math.ceil(p.getTotalLength())); } catch (e) { p.style.setProperty("--len", 1400); }
});

if (offOrb.length) {
  const lab = el("span", "gutter-label", "Hors orbite · aucun chemin");
  lab.style.top = "calc(" + (offOrb[0].pos.y / 10) + "% - 62px)";
  scene.appendChild(lab);
}

/* ── Capsules ────────────────────────────────────────────────────────────── */
const ROLE_FR = { origin: "origine", dr: "DR", transit: "transit", consumer: "consommateur", conflict: "conflit" };

function contractChips(host, provides, consumes, ctx) {
  if (!provides.length && !consumes.length) return;
  const box = el("div", "ctr");
  const add = (name, kind, klass) => {
    const b = el("button", "row " + klass); b.type = "button";
    b.appendChild(el("span", "kind", kind + " "));
    b.appendChild(el("span", "mono", name));
    b.addEventListener("click", ev => { ev.stopPropagation(); showContract(name, ctx); });
    box.appendChild(b);
  };
  provides.forEach(n => add(n, "provide", "prov"));
  consumes.forEach(n => add(n, "consume", "cons"));
  host.appendChild(box);
}

function buildFabric(m) {
  const f = m.f;
  const card = el("div", "fab" + (m.advertises ? " route" : "") + (m.classifies ? " sec" : "") + (m.conflict ? " anomaly" : ""));
  card.style.left = (m.pos.x / 10) + "%";
  card.style.top  = (m.pos.y / 10) + "%";
  card.dataset.id = f.id;
  card.style.setProperty("--i", model.indexOf(m));

  const btn = el("button", "fab-btn"); btn.type = "button";
  btn.setAttribute("aria-expanded", "false");
  btn.setAttribute("aria-label", f.id + " · " + f.site + " · " +
    (m.conflict ? "conflit, aucun L3Out" :
     (m.advertises ? "annonce le préfixe" : "") + (m.advertises && m.classifies ? " et " : "") +
     (m.classifies ? "classifie le préfixe" + (m.exact ? "" : " par agrégat") : "")));

  const l1 = el("div", "fab-line1");
  l1.appendChild(el("span", "fab-id mono", f.id));
  l1.appendChild(el("span", m.conflict ? "tag-warn" : "fab-role", m.conflict ? "conflit" : (ROLE_FR[f.role] || f.role)));
  btn.appendChild(l1);

  const l3n = f.l3outs.length;
  btn.appendChild(el("div", "fab-sub", f.site + " · " + (l3n ? l3n + " L3Out" + (l3n > 1 ? "s" : "") : "aucun L3Out") +
    (f.bd ? " · " + f.bd.vrf : (f.l3outs[0] ? " · " + f.l3outs[0].vrf : ""))));

  const ax = el("div", "fab-ax");
  const mk = (kind, on, label) => {
    const s = el("span", "ax " + kind + (on ? " on" : " off"));
    s.appendChild(glyph(kind)); s.appendChild(el("span", "lbl", label));
    s.setAttribute("aria-label", label + (on ? " : oui" : " : non"));
    return s;
  };
  ax.appendChild(mk("route", m.advertises, "annoncé"));
  ax.appendChild(mk("sec", m.classifies, "classifié"));
  btn.appendChild(ax);
  if (m.onlyApprox) {
    const a = el("div", "ax-approx");
    a.appendChild(el("span", "t", "match par agrégat"));
    a.appendChild(el("span", "mono", "⊃ " + m.hits[0].sn.ip));
    a.title = "Aucun l3extSubnet exact : la requête est couverte par un agrégat";
    btn.appendChild(a);
  }
  card.appendChild(btn);

  /* ── corps déplié ── */
  const body = el("div", "fab-body");
  const bin  = el("div", "fab-body-in");
  body.appendChild(bin);

  if (m.conflict) {
    const w = el("div", "warn");
    w.appendChild(el("span", null, "⚠"));
    const t = el("span", null, "");
    t.append("Même préfixe dans ", Object.assign(el("span", "mono", f.bd.tenant + " / " + f.bd.vrf), {}),
      " — gateway ", el("span", "mono", f.bd.subnet.ip), ". VRF distinct de ",
      el("span", "mono", refVrfName), ", aucun L3Out : ce fabric ne participe à aucun chemin. ",
      "VLAN ", el("span", "mono", f.epgs[0] ? f.epgs[0].encap : "—"), " réutilisé.");
    w.appendChild(t); bin.appendChild(w);
  }

  if (f.l3outs.length) {
    bin.appendChild(el("h6", "sec-h", "L3Outs & ext-EPGs"));
    f.l3outs.forEach(l3 => {
      const r = el("button", "row"); r.type = "button";
      r.appendChild(el("div", "row-t mono", l3.name));
      r.appendChild(el("div", "row-s", "VRF " + l3.vrf + " · nodes " + l3.nodes.join(", ") + " · enforceRtctrl " + l3.enforceRtctrl));
      r.addEventListener("click", ev => { ev.stopPropagation(); showL3out(l3, f); });
      bin.appendChild(r);

      const nest = el("div", "nest");
      l3.extEpgs.forEach(ee => {
        const er = el("button", "row"); er.type = "button";
        er.appendChild(el("div", "row-t mono", ee.name));
        er.appendChild(el("div", "row-s", "ext-EPG · prefGrMemb " + ee.prefGrMemb));
        er.addEventListener("click", ev => { ev.stopPropagation(); showExtEpg(ee, l3, f); });
        nest.appendChild(er);

        ee.subnets.forEach(sn => {
          const c = cidr(sn.ip);
          const isExact = c.n === Q.n && c.len === Q.len;
          const isCatch = c.len === 0;
          const isHit = isExact || (contains(c, Q) && !isCatch);
          const sr = el("button", "row"); sr.type = "button";
          if (!isHit) sr.style.opacity = ".45";
          const head = el("div", "pfx");
          head.appendChild(el("span", "pfx-ip mono", sn.ip));
          if (isExact)        head.appendChild(el("span", "badge-exact", "match exact"));
          else if (isHit)     head.appendChild(el("span", "badge-approx", "agrégat ⊃"));
          else if (isCatch)   head.appendChild(el("span", "badge-approx", "catch-all"));
          sr.appendChild(head);
          const sc = el("div", "scopes");
          sn.scope.forEach(s => sc.appendChild(scopeChip(s)));
          sr.appendChild(sc);
          sr.addEventListener("click", ev => { ev.stopPropagation(); showSubnet(sn, ee, l3, f); });
          nest.appendChild(sr);
        });
        contractChips(nest, ee.provides, ee.consumes, f);
      });
      bin.appendChild(nest);
    });
  }

  if (f.bd) {
    bin.appendChild(el("h6", "sec-h", "Bridge Domain & EPG"));
    const br = el("button", "row"); br.type = "button";
    br.appendChild(el("div", "row-t mono", f.bd.name));
    br.appendChild(el("div", "row-s", "tenant " + f.bd.tenant + " · VRF " + f.bd.vrf + " · gw " + f.bd.subnet.ip));
    br.addEventListener("click", ev => { ev.stopPropagation(); showBd(f.bd, f); });
    bin.appendChild(br);
    f.epgs.forEach(e => {
      const r = el("button", "row"); r.type = "button";
      r.appendChild(el("div", "row-t mono", e.name));
      const drift = (m.encapDrift ? " ⚠ encap ≠ " + refEncap : "");
      r.appendChild(el("div", "row-s", e.encap + " · " + (e.deployment === "aaep" ? "déployé via AAEP (aucun static port)" : "static port") + drift));
      r.addEventListener("click", ev => { ev.stopPropagation(); showEpg(e, f); });
      bin.appendChild(r);
      contractChips(bin, e.provides, e.consumes, f);
    });
  }

  card.appendChild(body);

  /* interactions */
  btn.addEventListener("click", () => toggle(m, card, btn));
  const hl = on => { if (!scene.classList.contains("has-open")) highlight(on ? f.id : null); };
  card.addEventListener("mouseenter", () => hl(true));
  card.addEventListener("mouseleave", () => hl(false));
  btn.addEventListener("focus", () => hl(true));
  btn.addEventListener("blur", () => hl(false));

  scene.appendChild(card);
  m.card = card; m.btn = btn;
  return card;
}
model.forEach(buildFabric);

/* ── Survol : met en évidence le chemin ──────────────────────────────────── */
function highlight(id) {
  if (!id) { scene.removeAttribute("data-hl"); arcEls.forEach(a => a.g.classList.remove("hl"));
             model.forEach(m => m.card.classList.remove("hl")); return; }
  scene.setAttribute("data-hl", id);
  const peers = new Set([id]);
  arcEls.forEach(a => {
    const on = (a.p.from && a.p.from.f.id === id) || a.p.to.f.id === id;
    a.g.classList.toggle("hl", on);
    if (on) { if (a.p.from) peers.add(a.p.from.f.id); peers.add(a.p.to.f.id); }
  });
  model.forEach(m => m.card.classList.toggle("hl", peers.has(m.f.id)));
}

/* ── Ouvrir / fermer une capsule (zoom sémantique en place) ──────────────── */
let openM = null;
function closeAll() {
  if (openM) { openM.card.classList.remove("is-open"); openM.btn.setAttribute("aria-expanded", "false");
               openM.card.style.removeProperty("--dx"); openM.card.style.removeProperty("--dy"); }
  openM = null; scene.classList.remove("has-open"); highlight(null);
}
function toggle(m, card, btn) {
  if (openM === m) { closeAll(); showOverview(); return; }
  closeAll();
  openM = m; scene.classList.add("has-open");
  card.classList.add("is-open"); btn.setAttribute("aria-expanded", "true");
  /* les arcs du fabric ouvert restent allumés */
  arcEls.forEach(a => a.g.classList.toggle("hl", (a.p.from && a.p.from.f.id === m.f.id) || a.p.to.f.id === m.f.id));
  /* Recadrage : la capsule dépliée doit rester entièrement dans la scène.
     On mesure la géométrie FINALE en neutralisant la transition le temps d'un reflow,
     on revient à l'état replié, puis on rejoue l'ouverture avec le décalage calculé —
     sinon la mesure se ferait au milieu de l'animation et ne servirait à rien. */
  card.classList.add("measuring");
  void card.offsetWidth;
  const r = card.getBoundingClientRect(), s = scene.getBoundingClientRect(), pad = 14;
  let dx = 0, dy = 0;
  if (r.left  < s.left   + pad) dx = s.left   + pad - r.left;
  if (r.right > s.right  - pad) dx = s.right  - pad - r.right;
  if (r.top   < s.top    + pad) dy = s.top    + pad - r.top;
  if (r.bottom > s.bottom - pad) dy = s.bottom - pad - r.bottom;
  card.classList.remove("is-open");
  void card.offsetWidth;
  card.classList.remove("measuring");
  card.classList.add("is-open");
  card.style.setProperty("--dx", Math.round(dx) + "px");
  card.style.setProperty("--dy", Math.round(dy) + "px");
  showFabric(m);
}

/* ═══════════════════════════════════════════════════════════════════════════
   4 · Inspecteur — attributs bruts + DN
   ═══════════════════════════════════════════════════════════════════════════ */
const iK = document.getElementById("insp-kicker"), iT = document.getElementById("insp-title"),
      iB = document.getElementById("insp-body"),   iF = document.getElementById("insp-foot");

function insp(kicker, title, dn) { iK.textContent = kicker; iT.textContent = title; iB.textContent = "";
  iF.textContent = dn ? "DN · " + dn : ""; return iB; }
function kv(host, pairs) {
  const d = el("dl", "kv");
  pairs.forEach(p => { if (p[1] == null || p[1] === "") return;
    d.appendChild(el("dt", null, p[0])); d.appendChild(el("dd", p[2] === false ? "" : "mono", String(p[1]))); });
  host.appendChild(d); return d;
}
function section(host, t) { const s = el("div", "insp-sec"); s.appendChild(el("h6", null, t)); host.appendChild(s); return s; }

function showOverview() {
  const b = insp("Vue d'ensemble", DATA.query.value, null);
  kv(b, [["Type", DATA.query.type, false], ["Fabrics", model.length + " porteurs du préfixe", false],
         ["En orbite", orbit.length + " avec un l3extSubnet correspondant", false],
         ["Hors orbite", offOrb.length + " (conflit de VRF)", false]]);

  const s1 = section(b, "Chemins inter-fabric");
  paths.forEach(p => {
    const r = el("button", "pathrow" + (p.kind === "approx" ? " approx" : "")); r.type = "button";
    r.appendChild(el("span", "mono", p.from.f.id));
    r.appendChild(el("span", "arrow", "⟶"));
    r.appendChild(el("span", "mono", p.to.f.id));
    if (p.kind === "approx") r.appendChild(el("span", "badge-approx", "agrégat"));
    r.addEventListener("mouseenter", () => { if (!openM) highlight(p.to.f.id); });
    r.addEventListener("mouseleave", () => { if (!openM) highlight(null); });
    r.addEventListener("click", () => { toggle(p.to, p.to.card, p.to.btn); });
    s1.appendChild(r);
  });
  offOrb.forEach(m => {
    const r = el("button", "pathrow approx"); r.type = "button";
    r.appendChild(el("span", "mono", m.f.id));
    r.appendChild(el("span", "arrow", "⊘"));
    r.appendChild(el("span", null, "aucun chemin · " + m.f.bd.vrf));
    r.addEventListener("click", () => toggle(m, m.card, m.btn));
    s1.appendChild(r);
  });

  const s2 = section(b, "Les deux axes");
  [["route", "export-rtctrl", "Advertised Externally", "Le préfixe est ANNONCÉ vers l'extérieur. C'est du routage. Ces fabrics sont à gauche de l'axe."],
   ["sec", "import-security", "External Subnets for the External EPG", "Le préfixe CLASSIFIE le trafic entrant dans l'ext-EPG. C'est de la sécurité. Ces fabrics sont à droite."],
   ["route", "import-rtctrl", "Import Route Control", "Filtre les routes reçues. Axe routage, sens entrant."],
   ["sec", "shared-security", "Shared Security Import", "Classification inter-VRF (route leaking). Puce en pointillés."],
   ["route", "shared-rtctrl", "Shared Route Control", "Annonce inter-VRF. Puce en pointillés."]
  ].forEach(([ax, name, en, fr]) => {
    const it = el("div", "legend-item");
    it.appendChild(scopeChip(name));
    const t = el("div", "txt"); t.appendChild(el("b", null, en)); t.append(" — " + fr);
    it.appendChild(t); s2.appendChild(it);
  });
}

function showFabric(m) {
  const f = m.f;
  const b = insp("Fabric", f.id, f.l3outs[0] ? f.l3outs[0].dn : (f.bd ? f.bd.dn : ""));
  kv(b, [["Site", f.site, false], ["Rôle", ROLE_FR[f.role] || f.role, false],
         ["APIC", f.apicVersion], ["Backup", f.backupTs],
         /* AXIS[s] est gardé : un scope ACI inconnu du tableau (nouvelle version d'APIC)
            ne doit pas faire planter tout le panneau d'inspection. */
         ["Annonce", m.advertises ? "oui — " + m.scopes.filter(s => AXIS[s] && AXIS[s].axis === "route").join(", ") : "non", false],
         ["Classifie", m.classifies ? "oui — " + m.scopes.filter(s => AXIS[s] && AXIS[s].axis === "sec").join(", ") : "non", false],
         ["Match", m.hits.length ? (m.exact ? "exact " + DATA.query.value : "par agrégat " + m.hits[0].sn.ip) : "aucun l3extSubnet", false]]);
  if (m.encapDrift) {
    const s = section(b, "Écart détecté");
    s.appendChild(el("div", "warn", "Encap " + m.encapDrift + " ici, " + refEncap + " sur le fabric d'origine."));
  }
  if (m.conflict) {
    const s = section(b, "Anomalie");
    s.appendChild(el("div", "warn", "Préfixe dupliqué dans " + f.bd.tenant + " / " + f.bd.vrf +
      " (gateway " + f.bd.subnet.ip + "), sans L3Out. Recouvrement d'adressage hors du VRF " + refVrfName + "."));
  }
}
function showL3out(l3, f) {
  const b = insp("L3Out · " + f.id, l3.name, l3.dn);
  kv(b, [["VRF", l3.vrf], ["Domain", l3.domain], ["enforceRtctrl", l3.enforceRtctrl],
         ["Border leaves", l3.nodes.join(", ")], ["ext-EPGs", l3.extEpgs.map(e => e.name).join(", ")]]);
}
function showExtEpg(ee, l3, f) {
  const b = insp("ext-EPG · " + f.id, ee.name, ee.dn);
  kv(b, [["L3Out", l3.name], ["VRF", l3.vrf], ["prefGrMemb", ee.prefGrMemb],
         ["Provides", ee.provides.join(", ") || "—"], ["Consumes", ee.consumes.join(", ") || "—"]]);
  const s = section(b, "l3extSubnet");
  ee.subnets.forEach(sn => {
    const r = el("button", "row"); r.type = "button";
    r.appendChild(el("div", "row-t mono", sn.ip));
    const sc = el("div", "scopes"); sn.scope.forEach(x => sc.appendChild(scopeChip(x))); r.appendChild(sc);
    r.addEventListener("click", () => showSubnet(sn, ee, l3, f));
    s.appendChild(r);
  });
}
function showSubnet(sn, ee, l3, f) {
  const c = cidr(sn.ip);
  const kind = (c.n === Q.n && c.len === Q.len) ? "match exact"
             : c.len === 0 ? "catch-all 0.0.0.0/0 — non retenu comme match"
             : contains(c, Q) ? "agrégat contenant la requête" : "sans rapport";
  const b = insp("l3extSubnet · " + f.id, sn.ip, ee.dn + "/extsubnet-[" + sn.ip + "]");
  kv(b, [["ip", sn.ip], ["scope", sn.scope.join(",")], ["aggregate", sn.aggregate || "(vide)"],
         ["ext-EPG", ee.name], ["L3Out", l3.name], ["Correspondance", kind, false]]);
  const s = section(b, "Rôle du préfixe ici");
  sn.scope.forEach(x => {
    const it = el("div", "legend-item");
    it.appendChild(scopeChip(x));
    const t = el("div", "txt"); t.textContent = DATA.scopeLegend[x] || x; it.appendChild(t);
    s.appendChild(it);
  });
}
function showBd(bd, f) {
  const b = insp("Bridge Domain · " + f.id, bd.name, bd.dn);
  kv(b, [["Tenant", bd.tenant], ["VRF", bd.vrf], ["Subnet", bd.subnet.ip], ["Subnet scope", bd.subnet.scope],
         ["unicastRoute", bd.unicastRoute], ["arpFlood", bd.arpFlood], ["unkMacUcastAct", bd.unkMacUcastAct]]);
}
function showEpg(e, f) {
  const b = insp("EPG · " + f.id, e.name, e.dn);
  kv(b, [["Application Profile", e.ap], ["Encap", e.encap],
         ["Déploiement", e.deployment === "aaep" ? "AAEP (aucun static port)" : "static port", false],
         ["AAEP", e.aaep], ["Domain", e.domain],
         ["Paths", e.paths.length ? e.paths.map(p => p.tDn).join(" | ") : "—"],
         ["Provides", e.provides.join(", ") || "—"], ["Consumes", e.consumes.join(", ") || "—"]]);
}
function showContract(name, f) {
  const c = DATA.contracts[name];
  if (!c) return;
  const b = insp("Contract" + (f ? " · " + f.id : ""), name, c.dn);
  kv(b, [["scope", c.scope]]);
  c.subjects.forEach(sub => {
    const s = section(b, "Subject · " + sub.name);
    sub.filters.forEach(fl => {
      const r = el("div", "row");
      r.appendChild(el("div", "row-t mono", fl.name));
      r.appendChild(el("div", "row-s", "etherT " + fl.etherT + " · prot " + fl.prot + " · ports " + fl.dFromPort + "–" + fl.dToPort));
      s.appendChild(r);
    });
  });
}

/* ═══════════════════════════════════════════════════════════════════════════
   5 · Contrôles globaux + intro
   ═══════════════════════════════════════════════════════════════════════════ */
document.getElementById("core").addEventListener("click", () => { closeAll(); showOverview(); });
document.getElementById("btn-reset").addEventListener("click", () => { closeAll(); showOverview(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") { closeAll(); showOverview(); } });

function playIntro() {
  scene.classList.remove("intro"); void scene.offsetWidth; scene.classList.add("intro");
  /* l'intro dure ~1,8 s puis la scène est définitivement calme */
  setTimeout(() => scene.classList.remove("intro"), 2200);
}
document.getElementById("btn-replay").addEventListener("click", playIntro);

showOverview();
playIntro();
</script>
